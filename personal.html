<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hirsch Personal</title>
<meta name="theme-color" content="#0d0c0b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="personal.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hirsch Personal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* Layout: sticky top bar with tabs; each tab is a full-width working view, built for a kitchen tablet first */
.page{max-width:1280px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-size:24px;line-height:1;margin:0;white-space:nowrap}
.brand h1 small{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--kraft);margin-left:8px;vertical-align:4px}
.brand .sp{flex:1}
.who{color:var(--muted);font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;color:var(--muted);font-family:var(--label);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px;border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--kraft)}
.tab .badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--info);color:#0b1320;font-size:13px;text-align:center;margin-left:6px}
main{padding-block:18px 60px}
h2.view{font-family:var(--label);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h2.view .sp{flex:1}

/* auth */
.auth{max-width:380px;margin:48px auto;display:flex;flex-direction:column;gap:14px}
.auth .mark{font-family:var(--display);font-size:44px;line-height:.95;margin:0}
.auth p{color:var(--muted);margin:0}
.auth .row{display:flex;gap:10px;flex-wrap:wrap}

/* kitchen board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col h3{font-family:var(--label);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.col h3 .n{color:var(--muted);font-weight:600}
.col .stack{display:flex;flex-direction:column;gap:12px}
.col .empty{color:var(--faint);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center}
.ticket{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--info);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ticket.zubereitung{border-left-color:var(--warn)}
.ticket.fertig{border-left-color:var(--ok)}
.ticket.fresh{animation:pulse 1.2s ease-in-out 4}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(127,168,217,.45)}}
.t-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.t-no{font-family:var(--display);font-size:24px;line-height:1}
.t-where{font-family:var(--label);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.t-time{margin-left:auto;font-family:var(--label);font-weight:600;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.t-time.late{color:var(--bad)}
.t-meta{font-size:14px;color:var(--muted)}
.t-meta b{color:var(--fg);font-weight:500}
.t-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.t-items li{display:flex;gap:8px;font-size:17px}
.t-items .q{font-family:var(--label);font-weight:700;min-width:28px;color:var(--kraft)}
.t-note{background:#2a2216;border-radius:6px;padding:6px 9px;font-size:15px;color:#f1d9a6}
.t-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-foot .sum{font-family:var(--label);font-weight:700;font-size:18px;margin-right:auto;font-variant-numeric:tabular-nums}
.done-list{margin-top:26px}
.done-list summary{cursor:pointer;font-family:var(--label);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dl{display:grid;gap:6px;margin-top:10px}
.dl-row{display:grid;grid-template-columns:70px 64px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px}
.dl-row .x1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.dl-row{grid-template-columns:56px 1fr auto}.dl-row .hide-s{display:none}}

/* new order */
.neworder{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:860px){.neworder{grid-template-columns:1fr}}
.picker .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.picker .tools input{flex:1;min-width:180px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--label);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--kraft-ink);background:var(--kraft);border-color:var(--kraft)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:70px}
.pbtn:hover{border-color:var(--kraft)}
.pbtn b{font-family:var(--label);font-weight:600;font-size:16px;text-transform:uppercase;line-height:1.15}
.pbtn span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.pbtn[disabled]{opacity:.4;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:110px}
.panel h3{font-family:var(--label);font-weight:700;font-size:20px;text-transform:uppercase;margin:0}
.oline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.qty span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-family:var(--label);font-weight:700;font-size:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.err{color:var(--bad);margin:0;font-size:14px}

/* menu editor */
.mcat{margin-bottom:26px}
.mcat h3{font-family:var(--label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 92px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .nm{min-width:0}
.mrow .nm b{font-family:var(--label);font-weight:600;font-size:17px;text-transform:uppercase;display:block}
.mrow .nm small{color:var(--faint);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow input[type=number]{padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.mhead{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 92px auto;gap:10px;color:var(--faint);font-size:12px;font-family:var(--label);letter-spacing:.1em;text-transform:uppercase}
.mhead span:nth-child(n+2){text-align:center}
.switch{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:#3a2620;cursor:pointer;justify-self:center}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#c9b9ad;transition:transform .15s}
.switch[aria-checked="true"]{background:#36502a}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:#cfe8bf}
@media (max-width:640px){
  .mhead{display:none}
  .mrow{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"nm nm nm" "pp pd av" "ed ed ed"}
  .mrow .nm{grid-area:nm}.mrow .pp{grid-area:pp}.mrow .pd{grid-area:pd}.mrow .av{grid-area:av}.mrow .ed{grid-area:ed;justify-self:start}
  .mrow .pp::before{content:"Abholen";}.mrow .pd::before{content:"Liefern";}
}
.mini{display:flex;flex-direction:column;gap:2px}
.mini::before{font-size:11px;color:var(--faint);font-family:var(--label);letter-spacing:.1em;text-transform:uppercase}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.dialog{position:fixed;inset:auto 0 0 0;z-index:41;background:var(--surface);border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.dialog{inset:5vh auto auto 50%;transform:translateX(-50%);width:min(720px,92vw);border-radius:14px;max-height:90vh}}
.dialog h3{font-family:var(--label);font-weight:700;font-size:22px;text-transform:uppercase;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.dialog .grid{display:grid;gap:12px}
.lgrid{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:center}
.lgrid .lc{font-family:var(--label);font-weight:700;color:var(--muted);letter-spacing:.08em}
.dialog .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dialog .actions .sp{flex:1}
.x{background:transparent;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--muted)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .k{font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--label);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{color:var(--faint);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.box h3{font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px}
.hbars{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;align-items:end;height:150px}
.hb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hb i{display:block;width:100%;background:var(--kraft);border-radius:4px 4px 0 0;min-height:2px}
.hb span{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.hb em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.toplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toplist li{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:15px;position:relative;padding:4px 8px;border-radius:6px;overflow:hidden}
.toplist li i{position:absolute;inset:0 auto 0 0;background:rgba(201,162,116,.16);z-index:0}
.toplist li span,.toplist li b{position:relative;z-index:1}
.toplist b{font-variant-numeric:tabular-nums}

/* QR + team */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.qcard{background:#f6f2ea;color:#111;border-radius:10px;padding:16px 12px;text-align:center}
.qcard .tm{font-family:var(--display);font-size:22px;line-height:.95}
.qcard .tn{font-family:var(--label);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;color:#7a5a33}
.qcard .qr{display:flex;justify-content:center;margin:10px auto;background:#fff;padding:6px;width:fit-content}
.qcard .qr img,.qcard .qr canvas{width:150px!important;height:150px!important}
.qcard .ll{font-family:var(--label);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.team{display:grid;gap:8px;margin-top:10px}
.trow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.trow .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted)}
</style>
</head>
<body>

<div id="authView" class="auth" hidden>
  <h1 class="mark">Imbiss<br>Hirsch</h1>
  <p id="authMsg">Personal-Bereich: Bestellungen, Speisekarte und Übersicht.</p>
  <div class="field"><label for="aEmail">E-Mail</label><input id="aEmail" type="email" autocomplete="username"></div>
  <div class="field"><label for="aPass">Passwort</label><input id="aPass" type="password" autocomplete="current-password" minlength="8"></div>
  <p class="err" id="authErr" hidden></p>
  <div class="row">
    <button class="btn big primary" id="loginBtn" type="button">Anmelden</button>
    <button class="btn big" id="signupBtn" type="button">Konto erstellen</button>
  </div>
</div>

<div id="pendingView" class="auth" hidden>
  <h1 class="mark">Fast<br>geschafft</h1>
  <p>Dein Konto <b id="pendingEmail"></b> ist angelegt. Ein Admin muss dich noch freischalten (Tab „Team“ → E-Mail eintragen).</p>
  <div class="row"><button class="btn" id="recheckBtn" type="button">Erneut prüfen</button><button class="btn" type="button" data-logout>Abmelden</button></div>
</div>

<div id="appView" hidden>
  <div class="top">
    <div class="top-in">
      <div class="brand">
        <h1>Hirsch <small>Personal</small></h1>
        <span class="sp"></span>
        <button class="btn" id="soundBtn" type="button" aria-pressed="false">Ton aus</button>
        <span class="who" id="who"></span>
        <button class="btn" type="button" data-logout>Abmelden</button>
      </div>
      <nav class="tabs" id="tabs">
        <a class="tab" href="#bestellungen">Bestellungen<span class="badge" id="newBadge" hidden>0</span></a>
        <a class="tab" href="#neu">Neue Bestellung</a>
        <a class="tab" href="#karte">Speisekarte</a>
        <a class="tab" href="#uebersicht">Übersicht</a>
        <a class="tab" href="#qr">QR &amp; Team</a>
      </nav>
    </div>
  </div>
  <div class="page">
    <main>
      <section id="v-bestellungen"></section>
      <section id="v-neu" hidden></section>
      <section id="v-karte" hidden></section>
      <section id="v-uebersicht" hidden></section>
      <section id="v-qr" hidden></section>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(IH_CONFIG.url, IH_CONFIG.key);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = v => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(+v || 0);
const LANGS = ["de","en","it","tr","fr"];
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
let me = null, staff = null;
let cats = [], items = [];
let orders = [];                 // today's orders with items
const seen = new Set();

/* ---------- helpers ---------- */
let toastT;
function toast(msg, err){ const t=$("toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, err?4000:1800); }
function berlinParts(d){ return Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d).map(p=>[p.type,p.value])); }
function berlinToday(){ const p = berlinParts(new Date()); return `${p.year}-${p.month}-${p.day}`; }
function dayRange(ymd){
  const [y,m,d] = ymd.split("-").map(Number);
  const noon = new Date(Date.UTC(y,m-1,d,12));
  const p = berlinParts(noon);
  const off = (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute) - noon.getTime())/60000;
  const start = new Date(Date.UTC(y,m-1,d) - off*60000);
  return [start.toISOString(), new Date(start.getTime() + 864e5).toISOString()];
}
const hhmm = iso => new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));
const minsAgo = iso => Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
const CH = {tisch:"Tisch", abholung:"Abholung", lieferung:"Lieferung"};
const SRC = {qr:"QR", telefon:"Telefon", whatsapp:"WhatsApp", theke:"Theke"};
const ST = {neu:"Neu", zubereitung:"In Zubereitung", fertig:"Fertig", abgeschlossen:"Abgeschlossen", storniert:"Storniert"};
function where(o){ return o.channel === "tisch" ? `Tisch ${esc(o.table_no)}` : o.channel === "abholung" ? `Abholung` : `Lieferung`; }

/* ---------- dialog ---------- */
function openDialog(html){ $("dialog").innerHTML = html; $("dialog").hidden = false; $("scrim").hidden = false; }
function closeDialog(){ $("dialog").hidden = true; $("scrim").hidden = true; $("dialog").innerHTML = ""; }
$("scrim").onclick = closeDialog;
addEventListener("keydown", e => { if (e.key === "Escape" && !$("dialog").hidden) closeDialog(); });

/* ---------- auth ---------- */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  me = session?.user || null;
  if (!me){ show("auth"); return; }
  let r = await sb.from("staff").select("*").eq("user_id", me.id).maybeSingle();
  if (!r.data){
    const c = await sb.rpc("claim_first_admin");
    if (c.data === true) r = await sb.from("staff").select("*").eq("user_id", me.id).maybeSingle();
  }
  staff = r.data;
  if (!staff){ $("pendingEmail").textContent = me.email; show("pending"); return; }
  $("who").textContent = me.email + (staff.is_admin ? " · Admin" : "");
  show("app");
  await loadMenu();
  await loadOrders(true);
  subscribe();
  route();
}
function show(v){ $("authView").hidden = v!=="auth"; $("pendingView").hidden = v!=="pending"; $("appView").hidden = v!=="app"; }
function authErr(m){ $("authErr").textContent = m; $("authErr").hidden = !m; }
$("loginBtn").onclick = async () => {
  authErr("");
  const { error } = await sb.auth.signInWithPassword({email: $("aEmail").value.trim(), password: $("aPass").value});
  if (error) return authErr(error.message === "Invalid login credentials" ? "E-Mail oder Passwort stimmt nicht." : error.message);
  boot();
};
$("signupBtn").onclick = async () => {
  authErr("");
  const email = $("aEmail").value.trim(), password = $("aPass").value;
  if (!email || password.length < 8) return authErr("E-Mail eingeben und ein Passwort mit mindestens 8 Zeichen wählen.");
  const { data, error } = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin + location.pathname}});
  if (error) return authErr(error.message);
  if (!data.session){ $("authMsg").textContent = "Fast fertig: Bestätige deine E-Mail über den Link, den wir dir geschickt haben. Danach hier anmelden."; return; }
  boot();
};
document.querySelectorAll("[data-logout]").forEach(b => b.onclick = async () => { await sb.auth.signOut(); location.hash = ""; location.reload(); });
$("recheckBtn").onclick = boot;

/* ---------- data ---------- */
async function loadMenu(){
  const [c, i] = await Promise.all([
    sb.from("categories").select("*").order("sort"),
    sb.from("menu_items").select("*").order("sort")
  ]);
  if (c.error || i.error) { toast("Speisekarte konnte nicht geladen werden", true); return; }
  cats = c.data; items = i.data;
}
async function loadOrders(first){
  const [from, to] = dayRange(berlinToday());
  const { data, error } = await sb.from("orders").select("*, order_items(*)")
    .or(`status.in.(neu,zubereitung,fertig),created_at.gte.${from}`)
    .order("created_at", {ascending:true}).limit(400);
  if (error){ toast("Bestellungen konnten nicht geladen werden", true); return; }
  const fresh = [];
  for (const o of data){ if (!seen.has(o.id)){ if (!first && o.status === "neu") fresh.push(o.id); seen.add(o.id); } }
  orders = data;
  if (fresh.length) alertNew(fresh);
  if (current === "bestellungen") renderBoard(fresh);
  updateBadge();
}

let reloadT;
function subscribe(){
  sb.channel("staff-orders")
    .on("postgres_changes", {event:"*", schema:"public", table:"orders"}, () => { clearTimeout(reloadT); reloadT = setTimeout(() => loadOrders(false), 400); })
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"order_items"}, () => { clearTimeout(reloadT); reloadT = setTimeout(() => loadOrders(false), 400); })
    .subscribe();
  // safety net if the realtime connection drops (tablet asleep etc.)
  setInterval(() => loadOrders(false), 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadOrders(false); });
}

/* ---------- sound ---------- */
let audio = null;
$("soundBtn").onclick = () => {
  if (audio){ audio.close(); audio = null; } else { try{ audio = new (window.AudioContext || window.webkitAudioContext)(); beep(); }catch(e){ audio = null; } }
  $("soundBtn").setAttribute("aria-pressed", !!audio);
  $("soundBtn").textContent = audio ? "Ton an" : "Ton aus";
};
function beep(){
  if (!audio) return;
  const t = audio.currentTime;
  [0, .18, .36].forEach((dt, k) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = k === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t+dt); g.gain.exponentialRampToValueAtTime(0.35, t+dt+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+dt+0.16);
    o.connect(g).connect(audio.destination); o.start(t+dt); o.stop(t+dt+0.18);
  });
}
let titleT;
function alertNew(ids){
  beep();
  if (navigator.vibrate) try{ navigator.vibrate([120,80,120]); }catch(e){}
  clearInterval(titleT); let k = 0;
  titleT = setInterval(() => { document.title = (k++ % 2) ? "Hirsch Personal" : `● ${ids.length} neue Bestellung`; if (k > 20){ clearInterval(titleT); document.title = "Hirsch Personal"; } }, 900);
  toast(ids.length === 1 ? `Neue Bestellung #${ids[0]}` : `${ids.length} neue Bestellungen`);
}
function updateBadge(){
  const n = orders.filter(o => o.status === "neu").length;
  $("newBadge").hidden = !n; $("newBadge").textContent = n;
}

/* ---------- routing ---------- */
let current = "bestellungen";
const VIEWS = ["bestellungen","neu","karte","uebersicht","qr"];
function route(){
  const h = location.hash.replace("#","");
  current = VIEWS.includes(h) ? h : "bestellungen";
  VIEWS.forEach(v => $("v-"+v).hidden = v !== current);
  document.querySelectorAll(".tab").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#"+current ? "page" : "false"));
  ({bestellungen: () => renderBoard([]), neu: renderNew, karte: renderMenuEditor, uebersicht: renderStats, qr: renderQR})[current]();
}
addEventListener("hashchange", () => { if (staff) route(); });

/* ========== 1. KITCHEN BOARD ========== */
function ticket(o, fresh){
  const late = (o.status === "neu" && minsAgo(o.created_at) >= 10) || (o.status === "zubereitung" && minsAgo(o.created_at) >= 20);
  const lines = (o.order_items || []).map(i => `<li><span class="q">${i.qty}×</span><span>${esc(i.name_de)}${i.note ? ` <em class="muted">(${esc(i.note)})</em>` : ""}</span></li>`).join("");
  const meta = [];
  if (o.customer_name) meta.push(`<b>${esc(o.customer_name)}</b>`);
  if (o.phone) meta.push(esc(o.phone));
  if (o.address) meta.push(esc(o.address));
  meta.push(SRC[o.source] || o.source);
  const next = {neu:["zubereitung","Annehmen"], zubereitung:["fertig","Fertig"], fertig:["abgeschlossen", o.channel === "lieferung" ? "Ausgeliefert" : "Abgeholt / bezahlt"]}[o.status];
  return `<article class="ticket ${o.status}${fresh ? " fresh" : ""}" data-id="${o.id}">
    <div class="t-head"><span class="t-no">#${o.id}</span><span class="t-where">${where(o)}</span>
      <span class="t-time${late ? " late" : ""}" title="${hhmm(o.created_at)} Uhr">${hhmm(o.created_at)} · ${minsAgo(o.created_at)} min</span></div>
    <div class="t-meta">${meta.join(" · ")}</div>
    <ul class="t-items">${lines}</ul>
    ${o.note ? `<div class="t-note">${esc(o.note)}</div>` : ""}
    <div class="t-foot"><span class="sum">${eur(o.total)}</span>
      <button class="btn danger" type="button" data-cancel="${o.id}">Storno</button>
      ${o.status !== "neu" ? `<button class="btn" type="button" data-back="${o.id}">Zurück</button>` : ""}
      <button class="btn primary" type="button" data-next="${o.id}" data-to="${next[0]}">${next[1]}</button></div>
  </article>`;
}
function renderBoard(fresh){
  if (current !== "bestellungen") return;
  const cols = [["neu","Neu"],["zubereitung","In Zubereitung"],["fertig","Fertig"]];
  const doneToday = orders.filter(o => o.status === "abgeschlossen" || o.status === "storniert").reverse();
  let h = `<h2 class="view">Bestellungen<span class="sp"></span><span class="muted" style="font-size:15px;font-family:var(--body);text-transform:none;font-weight:400">Neue Bestellungen erscheinen automatisch</span></h2><div class="board">`;
  for (const [st, label] of cols){
    const list = orders.filter(o => o.status === st);
    h += `<div class="col"><h3><span class="pill ${st}">${label}</span><span class="n">${list.length}</span></h3><div class="stack">`
      + (list.length ? list.map(o => ticket(o, fresh.includes(o.id))).join("") : `<div class="empty">Keine</div>`) + `</div></div>`;
  }
  h += `</div><details class="done-list"><summary>Heute erledigt (${doneToday.length})</summary><div class="dl">`
    + doneToday.map(o => `<div class="dl-row"><b>#${o.id}</b><span class="num">${hhmm(o.created_at)}</span><span class="x1">${where(o)} · ${(o.order_items||[]).map(i => i.qty+"× "+esc(i.name_de)).join(", ")}</span><span class="pill ${o.status} hide-s">${ST[o.status]}</span><span class="num">${eur(o.total)}</span></div>`).join("")
    + `</div></details>`;
  const open = document.querySelector(".done-list")?.open;
  $("v-bestellungen").innerHTML = h;
  if (open) document.querySelector(".done-list").open = true;
  $("v-bestellungen").querySelectorAll("[data-next]").forEach(b => b.onclick = () => setStatus(+b.dataset.next, b.dataset.to));
  $("v-bestellungen").querySelectorAll("[data-back]").forEach(b => b.onclick = () => {
    const o = orders.find(x => x.id === +b.dataset.back); setStatus(o.id, o.status === "fertig" ? "zubereitung" : "neu");
  });
  $("v-bestellungen").querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => {
    if (b.dataset.armed){ setStatus(+b.dataset.cancel, "storniert"); return; }
    b.dataset.armed = "1"; b.textContent = "Wirklich stornieren?"; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = "Storno"; } }, 3500);
  });
}
async function setStatus(id, status){
  const o = orders.find(x => x.id === id); if (o) o.status = status; renderBoard([]); updateBadge();
  const { error } = await sb.from("orders").update({status}).eq("id", id);
  if (error){ toast("Status konnte nicht gespeichert werden", true); loadOrders(false); }
}
setInterval(() => { if (current === "bestellungen" && staff) renderBoard([]); }, 60000);

    <h3>Bestellung</h3>
    <div>${lines.map(l => `<div class="oline"><span>${esc(l.it.names.de)}</span><span class="qty"><button type="button" data-q="-1" data-id="${l.it.id}">−</button><span>${l.qty}</span><button type="button" data-q="1" data-id="${l.it.id}">+</button></span><span class="num">${eur(l.qty*ndPrice(l.it))}</span></div>`).join("") || `<p class="muted" style="margin:0">Gerichte links antippen.</p>`}</div>

    <div class="field"><span class="lbl">Art</span><div class="seg" id="ndCh">${["abholung","lieferung","tisch"].map(s => `<button type="button" data-v="${s}" aria-pressed="${nd.channel===s}">${CH[s]}</button>`).join("")}</div></div>

    <div class="field"><label for="ndPhone">Telefon</label><input id="ndPhone" type="tel" value="${esc(nd.phone)}"></div></div>`}
    ${nd.channel === "lieferung" ? `<div class="field"><label for="ndAddr">Adresse</label><textarea id="ndAddr" rows="2">${esc(nd.address)}</textarea></div>` : ""}
    <div class="field"><label for="ndNote">Anmerkung</label><textarea id="ndNote" rows="2">${esc(nd.note)}</textarea></div>

  $("v-neu").querySelectorAll("[data-add]").forEach(b => b.onclick = () => { ndCapture(); nd.cart[b.dataset.add] = (nd.cart[b.dataset.add]||0) + 1; renderNew(); });

function ndCapture(){

  if (v("ndAddr") !== null) nd.address = v("ndAddr");
  if (v("ndNote") !== null) nd.note = v("ndNote");
}
async function ndSend(){
  ndCapture(); nd.err = "";
  const p = {channel: nd.channel, source: nd.source, table_no: nd.channel === "tisch" ? nd.table : null,
    name: nd.channel === "tisch" ? null : nd.name, phone: nd.channel === "tisch" ? null : nd.phone,

    items: Object.entries(nd.cart).map(([id,qty]) => ({id, qty}))};

  const { data, error } = await sb.rpc("place_order", {p});

  toast(`Bestellung #${data.id} angelegt`);

}

    const id = inp.closest(".mrow").dataset.id, f = inp.dataset.f;

    b.setAttribute("aria-checked", val);

        <div class="field"><label for="eTag">Kennzeichnung</label><select id="eTag"><option value="">–</option><option value="veg" ${it.tag==="veg"?"selected":""}>Vegetarisch</option><option value="house" ${it.tag==="house"?"selected":""}>Hausspezialität</option></select></div>
        <div class="field"><label for="ePP">Preis Abholen / vor Ort €</label><input id="ePP" type="number" step="0.10" min="0" value="${it.price_pickup ?? ""}"></div>
        <div class="field"><label for="ePD">Preis Liefern €</label><input id="ePD" type="number" step="0.10" min="0" value="${it.price_delivery ?? ""}"></div>
      </div>
      <div class="field"><span class="lbl">Name (DE ist Pflicht; leere Sprachen zeigen den deutschen Namen)</span><div class="lgrid">${lrow("n", it.names, false)}</div></div>
      <div class="field"><span class="lbl">Beschreibung</span><div class="lgrid">${lrow("d", it.descs, true)}</div></div>
      <div class="field"><label for="eSort">Position in der Kategorie</label><input id="eSort" type="number" min="0" step="1" value="${it.sort ?? 0}" style="max-width:120px"></div>
      <p class="err" id="eErr" hidden></p>

    <div class="actions">
      ${!isNew && staff.is_admin ? `<button class="btn danger" type="button" id="eDel">Löschen</button>` : ""}

      <button class="btn" type="button" id="eCancel">Abbrechen</button>
      <button class="btn primary" type="button" id="eSave">Speichern</button>
    </div>`);
  $("dX").onclick = closeDialog; $("eCancel").onclick = closeDialog;
  $("eSave").onclick = async () => {
    const names = {}, descs = {};
    $("dialog").querySelectorAll("[data-n]").forEach(i => { const v = i.value.trim(); if (v) names[i.dataset.n] = v; });
    $("dialog").querySelectorAll("[data-d]").forEach(i => { const v = i.value.trim(); if (v) descs[i.dataset.d] = v; });
    if (!names.de){ $("eErr").textContent = "Bitte mindestens den deutschen Namen eintragen."; $("eErr").hidden = false; return; }
    const num = v => v === "" ? null : Math.round(parseFloat(v.replace(",", "."))*100)/100;
    const row = {category_id: $("eCat").value, tag: $("eTag").value || null, price_pickup: num($("ePP").value), price_delivery: num($("ePD").value),

    const q = isNew ? sb.from("menu_items").insert(row) : sb.from("menu_items").update(row).eq("id", it.id);

    const { error } = await sb.from("menu_items").delete().eq("id", it.id);
    if (error){ $("eErr").textContent = error.message; $("eErr").hidden = false; return; }
    closeDialog(); toast("Gelöscht"); await loadMenu(); renderMenuEditor();
  };
}

/* ========== 4. DAY OVERVIEW ========== */
let statsDay = null;
async function renderStats(){
  statsDay = statsDay || berlinToday();
  $("v-uebersicht").innerHTML = `<h2 class="view">Übersicht<span class="sp"></span><input type="date" id="sDay" value="${statsDay}" style="max-width:180px" aria-label="Tag"></h2><p class="muted">Lädt …</p>`;
  $("sDay").onchange = () => { statsDay = $("sDay").value || berlinToday(); renderStats(); };
  const [from, to] = dayRange(statsDay);
  const { data, error } = await sb.from("orders").select("*, order_items(*)").gte("created_at", from).lt("created_at", to).order("created_at");
  if (error){ $("v-uebersicht").querySelector("p").textContent = "Konnte nicht geladen werden."; return; }
  const ok = data.filter(o => o.status !== "storniert");
  const rev = ok.reduce((s,o) => s + +o.total, 0);
  const byCh = ch => ok.filter(o => o.channel === ch);
  const hours = Array.from({length:9}, (_,k) => 11 + k);
  const perH = hours.map(hr => ok.filter(o => +berlinParts(new Date(o.created_at)).hour === hr).length);
  const maxH = Math.max(1, ...perH);
  const top = {};
  ok.forEach(o => (o.order_items||[]).forEach(i => { top[i.name_de] = top[i.name_de] || {q:0, r:0}; top[i.name_de].q += i.qty; top[i.name_de].r += i.qty * +i.unit_price; }));
  const topList = Object.entries(top).sort((a,b) => b[1].q - a[1].q).slice(0, 10);
  const maxQ = Math.max(1, ...topList.map(t => t[1].q));
  const label = new Intl.DateTimeFormat("de-DE",{weekday:"long", day:"numeric", month:"long"}).format(new Date(statsDay + "T12:00:00"));
  let h = `<h2 class="view">Übersicht · ${esc(label)}<span class="sp"></span><input type="date" id="sDay" value="${statsDay}" style="max-width:180px" aria-label="Tag"></h2>
  <div class="kpis">
    <div class="kpi"><div class="k">Umsatz</div><div class="v">${eur(rev)}</div><div class="s">ohne Stornos</div></div>
    <div class="kpi"><div class="k">Bestellungen</div><div class="v">${ok.length}</div><div class="s">${data.length - ok.length} storniert</div></div>
    <div class="kpi"><div class="k">Ø Bon</div><div class="v">${eur(ok.length ? rev/ok.length : 0)}</div><div class="s">pro Bestellung</div></div>
    <div class="kpi"><div class="k">Tisch · Abholung · Lieferung</div><div class="v">${byCh("tisch").length} · ${byCh("abholung").length} · ${byCh("lieferung").length}</div><div class="s">${eur(byCh("lieferung").reduce((s,o)=>s+ +o.total,0))} Lieferumsatz</div></div>
  </div>
  <div class="two">
    <div class="box"><h3>Bestellungen pro Stunde</h3><div class="hbars">${hours.map((hr,k) => `<div class="hb"><em>${perH[k] || ""}</em><i style="height:${perH[k]/maxH*100}%"></i><span>${hr}</span></div>`).join("")}</div></div>
    <div class="box"><h3>Meistbestellt</h3>${topList.length ? `<ol class="toplist">${topList.map(([n,v]) => `<li><i style="width:${v.q/maxQ*100}%"></i><span>${esc(n)}</span><b>${v.q}× · ${eur(v.r)}</b></li>`).join("")}</ol>` : `<p class="muted">Noch keine Bestellungen an diesem Tag.</p>`}</div>
  </div>
  <div class="box" style="margin-top:18px"><h3>Alle Bestellungen</h3><div class="dl">${data.map(o => `<div class="dl-row"><b>#${o.id}</b><span class="num">${hhmm(o.created_at)}</span><span class="x1">${where(o)} · ${SRC[o.source]}${o.customer_name ? " · " + esc(o.customer_name) : ""}</span><span class="pill ${o.status} hide-s">${ST[o.status]}</span><span class="num">${eur(o.total)}</span></div>`).join("") || `<p class="muted">Keine.</p>`}</div></div>`;
  if (current !== "uebersicht") return;
  $("v-uebersicht").innerHTML = h;
  $("sDay").onchange = () => { statsDay = $("sDay").value || berlinToday(); renderStats(); };
}

/* ========== 5. QR CODES + TEAM ========== */
async function renderQR(){
  const base = store.get("ih-base") || (location.origin + location.pathname.replace(/personal\.html$/, ""));
  const n = +(store.get("ih-tables") || 10);
  let h = `<h2 class="view">QR-Codes für die Tische</h2>
    <p class="muted" style="margin-top:0">Jeder Tisch bekommt seinen eigenen Code: Gäste sehen die Karte in ihrer Sprache und bestellen direkt an ihren Tisch. Zum Drucken: Screenshot machen, ca. 5 × 5 cm.</p>
    <div class="g2" style="max-width:640px"><div class="field"><label for="qBase">Adresse der Gäste-App</label><input id="qBase" type="url" value="${esc(base)}"></div>
    <div class="field"><label for="qN">Anzahl Tische</label><input id="qN" type="number" min="1" max="60" value="${n}"></div></div>
    <div class="qrgrid" id="qGrid"></div>`;
  h += `<h2 class="view" style="margin-top:40px">Team</h2>`;
  if (staff.is_admin){
    h += `<p class="muted" style="margin-top:0">Neue Mitarbeiter registrieren sich zuerst auf dieser Seite mit „Konto erstellen“. Danach hier ihre E-Mail eintragen.</p>
      <div class="g2" style="max-width:640px;align-items:end"><div class="field"><label for="tEmail">E-Mail des Mitarbeiters</label><input id="tEmail" type="email"></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="tAdmin"> Admin</label><button class="btn primary" type="button" id="tAdd">Freischalten</button></div></div>
      <div class="team" id="tList"></div>`;
  } else {
    h += `<p class="muted">Nur Admins können Mitarbeiter freischalten.</p>`;
  }
  $("v-qr").innerHTML = h;
  const draw = () => {
    const b = $("qBase").value.trim().replace(/#.*$/, ""), k = Math.max(1, Math.min(60, +$("qN").value || 1));
    store.set("ih-base", b); store.set("ih-tables", k);
    const sep = b.includes("?") ? "&" : "?";
    const cards = [{label:"Abholen & Liefern", url:b}].concat(Array.from({length:k}, (_,i) => ({label:`Tisch ${i+1}`, url:`${b}${sep}tisch=${i+1}`})));
    $("qGrid").innerHTML = cards.map((c,i) => `<div class="qcard"><div class="tm">Imbiss<br>Hirsch</div><div class="qr" id="qr${i}"></div><div class="tn">${esc(c.label)}</div><div class="ll">Speisekarte · Menu · Menü</div></div>`).join("");
    cards.forEach((c,i) => new QRCode($("qr"+i), {text:c.url, width:300, height:300, correctLevel: QRCode.CorrectLevel.M}));
  };
  $("qBase").onchange = draw; $("qN").onchange = draw; draw();
  if (staff.is_admin){
    $("tAdd").onclick = async () => {
      const { error } = await sb.rpc("add_staff", {p_email: $("tEmail").value, p_admin: $("tAdmin").checked});
      if (error) return toast(error.message, true);
      toast("Freigeschaltet"); $("tEmail").value = ""; loadTeam();
    };
    loadTeam();
  }
}
async function loadTeam(){
  const { data } = await sb.from("staff").select("*").order("created_at");
  $("tList").innerHTML = (data||[]).map(s => `<div class="trow"><span class="em">${esc(s.email || s.user_id)}</span>${s.is_admin ? `<span class="pill">Admin</span>` : ""}
    ${s.user_id === me.id ? `<span class="muted">Du</span>` : `<button class="btn danger" type="button" data-rm="${s.user_id}">Entfernen</button>`}</div>`).join("");
  $("tList").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Wirklich entfernen?"; return; }
    const { error } = await sb.from("staff").delete().eq("user_id", b.dataset.rm);
    if (error) return toast(error.message, true);
    loadTeam();
  });
}

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT"){ staff = null; show("auth"); } });
boot();
</script>
