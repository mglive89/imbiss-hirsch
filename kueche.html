<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hirsch Küche</title>
<meta name="theme-color" content="#0d0c0b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="kueche.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hirsch Küche">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* Kitchen display: read from 2–3 m away. Paid orders only, oldest payment first. Right rail = ready for hand-out. */
html,body{height:100%;overflow:hidden}
body{font-size:18px;display:flex;flex-direction:column}
#authView{overflow-y:auto}
.kbar{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.kbar h1{font-family:var(--display);font-size:26px;line-height:1;margin:0}
.kbar h1 small{font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--kraft);margin-left:10px;vertical-align:5px}
.kbar .sp{flex:1}
.clock{font-family:var(--label);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.count{font-family:var(--label);font-weight:600;font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.count b{color:var(--fg);font-size:24px}
.conn{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.conn.off{background:var(--bad)}
.kmain{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;padding-block:16px;min-height:0}
@media (max-width:820px){.kmain{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.rail{max-height:30vh}}
.queue{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--info);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.zubereitung{border-top-color:var(--warn)}
.card.late{border-top-color:var(--bad)}
.card.fresh{animation:flash 1s ease-in-out 5}
@keyframes flash{50%{background:#1f2a38}}
.c-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.c-no{font-family:var(--display);font-size:38px;line-height:1}
.c-where{font-family:var(--label);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.c-min{margin-left:auto;font-family:var(--label);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.card.late .c-min{color:var(--bad)}
.c-sub{font-size:15px;color:var(--muted)}
.c-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.c-items li{display:flex;gap:10px;font-size:22px;line-height:1.2}
.c-items .q{font-family:var(--label);font-weight:700;font-size:26px;min-width:40px;color:var(--kraft)}
.c-items em{display:block;font-style:normal;font-size:17px;color:#f1d9a6}
.c-note{background:#3a2b14;color:#ffe3a8;border-radius:8px;padding:8px 10px;font-size:19px;font-weight:500}
.c-foot{display:flex;gap:10px;margin-top:auto}
.c-foot .btn{flex:1;padding:14px;font-size:20px}
.c-foot .btn.undo{flex:0 0 auto}
.rail{max-height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start}
.rail h2{font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--ok)}
.rail p{margin:0;color:var(--faint);font-size:14px}
.ready{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:8px;padding:8px 10px}
.ready b{font-family:var(--display);font-size:24px}
.ready span{flex:1;font-family:var(--label);font-weight:600;font-size:17px;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ready button{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:4px 8px;cursor:pointer;font-family:var(--label);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--faint);padding:60px 10px;font-family:var(--label);font-size:26px;text-transform:uppercase;letter-spacing:.06em}
.logo-auth{display:block;width:100%;height:auto;margin:0 auto 6px}
.logo-top{height:46px;width:auto;vertical-align:middle}
.kbar h1{display:flex;align-items:center;gap:4px}
.auth{max-width:380px;margin:48px auto;display:flex;flex-direction:column;gap:14px}
.auth .mark{font-family:var(--display);font-size:44px;line-height:.95;margin:0}
.auth p{color:var(--muted);margin:0}
.err{color:var(--bad);margin:0}
</style>
</head>
<body>

<div id="authView" class="auth" hidden>
  <img class="logo-auth" src="img/logo.jpg" width="846" height="490" alt="Imbiss Hirsch seit 1975">
  <p id="authMsg">Mit dem Personal-Konto anmelden.</p>
  <div class="field"><label for="aEmail">E-Mail</label><input id="aEmail" type="email" autocomplete="username"></div>
  <div class="field"><label for="aPass">Passwort</label><input id="aPass" type="password" autocomplete="current-password"></div>
  <p class="err" id="authErr" hidden></p>
  <button class="btn big primary" id="loginBtn" type="button">Anmelden</button>
</div>

<div id="appView" hidden style="display:contents">
  <header class="kbar">
    <h1><img class="logo-top" src="img/logo.jpg" width="846" height="490" alt="Imbiss Hirsch"><small>Küche</small></h1>
    <span class="conn" id="conn" title="Verbindung"></span>
    <span class="count">In Arbeit <b id="cntQ">0</b></span>
    <span class="count">Fertig <b id="cntR">0</b></span>
    <span class="sp"></span>
    <button class="btn" id="soundBtn" type="button" aria-pressed="false">Ton aus</button>
    <button class="btn" id="fsBtn" type="button">Vollbild</button>
    <span class="clock" id="clock">--:--</span>
  </header>
  <div class="kmain">
    <section class="queue" id="queue" aria-live="polite"></section>
    <aside class="rail">
      <h2>Fertig · zur Ausgabe</h2>
      <p>Die Kasse gibt aus und schließt ab.</p>
      <div id="ready" style="display:flex;flex-direction:column;gap:8px"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(IH_CONFIG.url, IH_CONFIG.key);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let orders = [], seen = new Set(), first = true;

function toast(msg, err){ const t=$("toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.hidden=false; clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true, 2500); }
const minsSince = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/60000));
const where = o => o.channel === "tisch" ? `Tisch ${esc(o.table_no)}` : o.channel === "abholung" ? `Abholung${o.customer_name ? " · " + esc(o.customer_name) : ""}` : `Lieferung`;

/* ---------- auth ---------- */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ show(false); return; }
  const { data: staff } = await sb.from("staff").select("user_id").eq("user_id", session.user.id).maybeSingle();
  if (!staff){ show(false); $("authErr").textContent = "Dieses Konto ist noch nicht freigeschaltet."; $("authErr").hidden = false; await sb.auth.signOut(); return; }
  show(true);
  await load();
  subscribe();
  wake();
}
function show(app){ $("authView").hidden = app; $("appView").hidden = !app; }
$("loginBtn").onclick = async () => {
  $("authErr").hidden = true;
  const { error } = await sb.auth.signInWithPassword({email: $("aEmail").value.trim(), password: $("aPass").value});
  if (error){ $("authErr").textContent = "E-Mail oder Passwort stimmt nicht."; $("authErr").hidden = false; return; }
  boot();
};

/* ---------- data: only paid orders ---------- */
async function load(){
  const { data, error } = await sb.from("orders").select("*, order_items(*)")
    .neq("payment", "offen").in("status", ["neu","zubereitung","fertig"])
    .order("paid_at", {ascending:true}).limit(200);
  $("conn").classList.toggle("off", !!error);
  if (error) return;
  const fresh = [];
  for (const o of data){ if (!seen.has(o.id)){ seen.add(o.id); if (!first && o.status !== "fertig") fresh.push(o.id); } }
  first = false;
  orders = data;
  render(fresh);
  if (fresh.length){ beep(); toast(fresh.length === 1 ? `Neue Bestellung #${fresh[0]}` : `${fresh.length} neue Bestellungen`); }
}
let reloadT;
function subscribe(){
  sb.channel("kitchen")
    .on("postgres_changes", {event:"*", schema:"public", table:"orders"}, () => { clearTimeout(reloadT); reloadT = setTimeout(load, 300); })
    .subscribe(st => $("conn").classList.toggle("off", st !== "SUBSCRIBED"));
  setInterval(load, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ load(); wake(); } });
}

/* ---------- render ---------- */
function render(fresh = []){
  const queue = orders.filter(o => o.status !== "fertig");
  const ready = orders.filter(o => o.status === "fertig").sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  $("cntQ").textContent = queue.length; $("cntR").textContent = ready.length;
  $("queue").innerHTML = queue.length ? queue.map(o => {
    const m = minsSince(o.paid_at || o.created_at), late = m >= 15;
    const items = (o.order_items || []).map(i => `<li><span class="q">${i.qty}×</span><span>${esc(i.name_de)}${i.note ? `<em>${esc(i.note)}</em>` : ""}</span></li>`).join("");
    const sub = [o.channel === "lieferung" ? esc(o.address || "") : "", o.payment === "bei_lieferung" ? "Zahlung bei Lieferung" : ""].filter(Boolean).join(" · ");
    return `<article class="card ${o.status}${late ? " late" : ""}${fresh.includes(o.id) ? " fresh" : ""}">
      <div class="c-head"><span class="c-no">#${o.id}</span><span class="c-where">${where(o)}</span><span class="c-min">${m} min</span></div>
      ${sub ? `<div class="c-sub">${sub}</div>` : ""}
      <ul class="c-items">${items}</ul>
      ${o.note ? `<div class="c-note">${esc(o.note)}</div>` : ""}
      <div class="c-foot">${o.status === "neu"
        ? `<button class="btn primary" type="button" data-to="zubereitung" data-id="${o.id}">Start</button>`
        : `<button class="btn undo" type="button" data-to="neu" data-id="${o.id}" aria-label="Zurück auf Neu">↩</button><button class="btn primary" type="button" data-to="fertig" data-id="${o.id}">Fertig</button>`}</div>
    </article>`;
  }).join("") : `<div class="empty">Keine offenen Bestellungen</div>`;
  $("ready").innerHTML = ready.length ? ready.map(o => `<div class="ready"><b>#${o.id}</b><span>${where(o)}</span><button type="button" data-to="zubereitung" data-id="${o.id}">Zurück</button></div>`).join("")
    : `<p>Noch nichts fertig.</p>`;
  document.querySelectorAll("[data-to]").forEach(b => b.onclick = () => setStatus(+b.dataset.id, b.dataset.to));
}
async function setStatus(id, status){
  const o = orders.find(x => x.id === id); if (o){ o.status = status; o.updated_at = new Date().toISOString(); } render();
  const { error } = await sb.from("orders").update({status}).eq("id", id);
  if (error){ toast("Konnte nicht gespeichert werden", true); load(); }
}
setInterval(() => { if (!$("appView").hidden) render(); }, 30000);

/* ---------- clock, sound, fullscreen, wake lock ---------- */
const clock = () => $("clock").textContent = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(new Date());
clock(); setInterval(clock, 10000);
let audio = null;
$("soundBtn").onclick = () => {
  if (audio){ audio.close(); audio = null; } else { try{ audio = new (window.AudioContext || window.webkitAudioContext)(); beep(); }catch(e){ audio = null; } }
  $("soundBtn").setAttribute("aria-pressed", !!audio); $("soundBtn").textContent = audio ? "Ton an" : "Ton aus";
};
function beep(){
  if (!audio) return;
  const t = audio.currentTime;
  [0,.2,.4].forEach((dt,k) => { const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = k === 2 ? 1320 : 880; g.gain.setValueAtTime(.0001,t+dt); g.gain.exponentialRampToValueAtTime(.45,t+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dt+.18);
    o.connect(g).connect(audio.destination); o.start(t+dt); o.stop(t+dt+.2); });
}
$("fsBtn").onclick = () => { const d = document; (d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen?.())?.catch?.(() => {}); };
let lock = null;
async function wake(){ try{ if ("wakeLock" in navigator && !lock){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } }catch(e){} }

if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
boot();
</script>
</body>
</html>
