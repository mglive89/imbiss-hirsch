<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hirsch Abholung</title>
<meta name="theme-color" content="#0d0c0b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="abholung.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hirsch Abholung">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* Pickup screen for the dining room TV: left = being prepared (small), right = ready (huge, green). Readable from across the room. */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font-size:18px}
.head{flex:none;display:flex;align-items:center;gap:16px;padding-block:14px;border-bottom:2px solid var(--line)}
.head img{height:clamp(44px,8vh,90px);width:auto}
.head .sp{flex:1}
.clock{font-family:var(--label);font-weight:700;font-size:clamp(26px,4vh,44px);font-variant-numeric:tabular-nums}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:2px;background:var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
@media (max-width:700px),(orientation:portrait) and (max-width:900px){.cols{grid-template-columns:1fr;grid-template-rows:minmax(0,.7fr) minmax(0,1.3fr)}}
.col{background:var(--bg);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;min-height:0}
.col h2{margin:0 0 4px;font-family:var(--label);font-weight:700;font-size:clamp(26px,4.4vh,52px);text-transform:uppercase;letter-spacing:.05em;line-height:1}
.col .sub{font-family:var(--label);font-weight:600;font-size:clamp(14px,2vh,22px);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
.prep h2{color:var(--warn)}
.ready h2{color:var(--ok)}
.list{flex:1;min-height:0;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px}
.n{font-family:var(--display);line-height:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.prep .n{font-size:clamp(30px,5vh,58px);color:var(--muted);background:var(--surface);padding:10px 16px;min-width:2.6em}
.ready .n{font-size:clamp(54px,11vh,140px);color:#0f1a0a;background:var(--ok);padding:14px 22px;min-width:2.4em}
.n small{font-family:var(--label);font-weight:700;font-size:.26em;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.prep .n small{color:var(--faint)}
.n.fresh{animation:pop 1.1s ease-in-out 6}
@keyframes pop{50%{transform:scale(1.07);background:var(--kraft)}}
.empty{font-family:var(--label);font-weight:600;font-size:clamp(18px,3vh,30px);color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.start{position:fixed;inset:0;z-index:50;background:rgba(13,12,11,.96);display:grid;place-items:center;text-align:center;padding:24px}
.start div{display:flex;flex-direction:column;gap:16px;align-items:center;max-width:460px}
.start img{width:min(100%,420px);height:auto}
.start p{color:var(--muted);margin:0}
.conn{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.conn.off{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.n.fresh{animation:none}}
</style>
</head>
<body>
<header class="head">
  <img src="img/logo.jpg" width="846" height="490" alt="Imbiss Hirsch">
  <span class="sp"></span>
  <span class="conn" id="conn" title="Verbindung"></span>
  <span class="clock" id="clock">--:--</span>
</header>
<div class="cols">
  <section class="col prep"><h2>In Zubereitung</h2><div class="sub">Preparing · In preparazione · Hazırlanıyor</div><div class="list" id="prep"></div></section>
  <section class="col ready"><h2>Bitte abholen</h2><div class="sub">Ready for pickup · Pronto da ritirare · Hazır</div><div class="list" id="ready" aria-live="polite"></div></section>
</div>

<div class="start" id="start">
  <div>
    <img src="img/logo.jpg" width="846" height="490" alt="Imbiss Hirsch">
    <p>Abhol-Anzeige für den Gastraum. Antippen, damit der Ton bei fertigen Bestellungen klingelt.</p>
    <button class="btn big primary" type="button" id="startBtn">Anzeige starten</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="appfeel.js"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(IH_CONFIG.url, IH_CONFIG.key, {auth:{persistSession:false}});
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let known = null;      // ids already shown as ready
const freshUntil = {}; // id -> timestamp until it keeps pulsing

const label = o => o.channel === "tisch" && o.table_no ? `Tisch ${esc(o.table_no)}` : o.channel === "lieferung" ? "Lieferung" : "Abholung";
async function load(){
  const { data, error } = await sb.rpc("ready_board");
  $("conn").classList.toggle("off", !!error);
  if (error || !Array.isArray(data)) return;
  const ready = data.filter(o => o.status === "fertig" && o.channel !== "lieferung");
  const prep = data.filter(o => o.status !== "fertig" && o.channel !== "lieferung");
  const ids = new Set(ready.map(o => o.id));
  if (known){
    const fresh = ready.filter(o => !known.has(o.id));
    if (fresh.length){ IHSound.ready(); fresh.forEach(o => freshUntil[o.id] = Date.now() + 8000); }
  }
  known = ids;
  $("prep").innerHTML = prep.length ? prep.map(o => `<div class="n">${o.id}<small>${label(o)}</small></div>`).join("") : `<div class="empty">—</div>`;
  $("ready").innerHTML = ready.length ? ready.slice().reverse().map(o => `<div class="n${freshUntil[o.id] > Date.now() ? " fresh" : ""}">${o.id}<small>${label(o)}</small></div>`).join("")
    : `<div class="empty">—</div>`;
}
const clock = () => $("clock").textContent = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(new Date());
clock(); setInterval(clock, 10000);

let lock = null;
async function wake(){ try{ if ("wakeLock" in navigator && !lock){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } }catch(e){} }
$("startBtn").onclick = () => {
  IHSound.unlock(); IHSound.received();
  try{ document.documentElement.requestFullscreen?.().catch(() => {}); }catch(e){}
  $("start").hidden = true; wake();
};
document.addEventListener("visibilitychange", () => { if (!document.hidden){ load(); wake(); } });
load(); setInterval(load, 4000);
if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
