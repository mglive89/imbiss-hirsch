<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Imbiss Hirsch</title>
<meta name="theme-color" content="#0d0c0b">
<meta name="description" content="Speisekarte und Bestellung – Imbiss Hirsch, Bietigheim-Bissingen. Tantuni & Burger seit 1975.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../assets/icons/kunde-64.png">
<link rel="apple-touch-icon" href="../assets/icons/kunde-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Imbiss Hirsch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/ih.css">
<style>
.wrap{max-width:640px;margin:0 auto}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* home: modelled on the printed cover */
header.hero{padding-block:30px 34px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cover{display:block;width:min(100%,520px);height:auto;margin:0 auto}
.feats{list-style:none;padding:0;margin:40px auto 0;display:grid;gap:28px;max-width:440px;text-align:left}
.feats li{display:flex;align-items:center;gap:18px}
.feats svg{flex:none;width:56px;height:56px;fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.feats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.feats b{font-family:var(--label);font-weight:700;font-size:clamp(24px,7vw,32px);line-height:1;text-transform:uppercase;letter-spacing:.01em}
.feats span{font-family:var(--label);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.feats a{color:inherit;text-decoration:none;white-space:nowrap}
.hoursbox{margin:36px auto 0;max-width:560px;border:2px solid var(--fg);padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 26px;
  font-family:var(--label);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:6px 14px;border-radius:999px;background:var(--surface);font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.03em}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(127,191,95,.18)}
.status.closed i{background:var(--bad);box-shadow:0 0 0 4px rgba(217,115,79,.18)}
.tablebadge{display:inline-block;margin-top:14px;font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--kraft-ink);background:var(--kraft);padding:4px 14px;border-radius:6px}
.ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.ioshint{color:var(--muted);font-size:14px;margin:12px auto 0;max-width:36ch}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-family:var(--label);font-weight:600;letter-spacing:.06em;font-size:14px;text-decoration:none;color:var(--fg)}
.lang[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#otype{margin-left:auto}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;background:var(--surface);border:0;border-radius:6px;padding:6px 11px;font-family:var(--label);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.cat.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--kraft)}

/* menu */
main{padding-block:8px 24px}
section.group{padding-top:28px;scroll-margin-top:118px}
.group h2{font-family:var(--label);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.items{list-style:none;margin:0;padding:0}
.item{padding-block:12px;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.item:last-child{border-bottom:0}
.item .txt{min-width:0}
.line{display:flex;align-items:baseline;gap:8px}
.name{font-family:var(--label);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;min-width:0}
.dots{flex:1;border-bottom:2px dotted #4a453f;transform:translateY(-4px);min-width:16px}
.price{font-family:var(--label);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.ask{font-weight:500;font-size:14px;color:var(--muted)}
.desc{color:var(--muted);font-size:15px;margin-top:3px;max-width:52ch}
.orig{font-size:13px;color:var(--faint);margin-top:2px}
.tag{display:inline-block;font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #5d7a4a;color:#a8c58f;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.tag.house{border-color:var(--kraft);color:var(--kraft)}
.tag.out{border-color:#5a2f22;color:var(--bad)}
.item.soldout .name,.item.soldout .price{color:var(--faint);text-decoration:line-through}
.add{width:40px;height:40px;border-radius:50%;border:1px solid var(--kraft);background:transparent;color:var(--kraft);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;margin-top:-4px}
.add:active{transform:scale(.94)}
.add[disabled]{border-color:var(--line);color:var(--faint);cursor:default}
.inCart{position:relative}
.inCart::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--kraft);color:var(--kraft-ink);font:700 12px/20px var(--label);text-align:center;padding:0 5px}

.info{margin-top:36px;border-top:1px solid var(--line);padding-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.info h3{font-family:var(--label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--kraft);margin:0 0 6px}
.info p{margin:0}
.note{color:var(--faint);font-size:13px;margin-top:28px}
.offline{background:var(--surface);border:1px solid #5a4a2a;color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:16px}
footer{padding-block:20px 20px;font-size:13px;color:var(--faint)}

/* cart bar + sheet */
.cartbar{transform:translateY(130%);transition:transform .5s var(--spring);pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,rgba(13,12,11,0))}
.cartbar button{width:100%;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--kraft);color:var(--kraft-ink);
  border:0;border-radius:12px;padding:14px 18px;font-family:var(--label);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cartbar .cnt{background:var(--kraft-ink);color:var(--kraft);border-radius:999px;padding:1px 10px;font-size:16px}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--label);font-weight:700;font-size:26px;text-transform:uppercase;margin:0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{background:transparent;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.cline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.cline .n{font-family:var(--label);font-weight:600;font-size:17px;text-transform:uppercase;min-width:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.sum{display:flex;justify-content:space-between;font-family:var(--label);font-weight:700;font-size:22px;text-transform:uppercase}
.formgrid{display:grid;gap:12px}
.hint{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--bad);font-size:15px;margin:0}
.done{text-align:center;padding-block:10px 4px}
.done .big{font-family:var(--display);font-size:56px;line-height:1;margin:6px 0}
.steps{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.readyov{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,rgba(127,191,95,.22),transparent 60%),var(--bg);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .3s}
.readyov.open{opacity:1}
.readyov.open .readybox{animation:popIn .7s var(--spring) both}
.readybox{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:420px}
.readybox .rt{font-family:var(--label);font-weight:700;font-size:44px;text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
.readybox .rn{font-family:var(--display);font-size:96px;line-height:1}
.readybox p{font-family:var(--label);font-weight:600;font-size:22px;text-transform:uppercase;margin:0}
@media (prefers-reduced-motion:no-preference){.readyov:not([hidden]) .rn{animation:readyPulse 1s ease-in-out infinite}}
@keyframes readyPulse{50%{transform:scale(1.08);color:var(--kraft)}}
.track{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;padding:6px 14px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer}

/* ---------- motion & polish ---------- */
.coverwrap{position:relative;display:block;width:min(100%,520px);margin:0 auto;overflow:hidden}
.coverwrap .cover{width:100%}
.coverwrap::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);mix-blend-mode:soft-light;transform:translateX(-130%);pointer-events:none}
.cartbar.show{transform:none;pointer-events:auto}
.add{transition:background-color .2s,color .2s,transform .2s var(--ease)}
.add:hover:not([disabled]){background:var(--kraft);color:var(--kraft-ink)}
.add.added{animation:addSpin .55s var(--spring)}
@keyframes addSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(90deg) scale(1.25);background:var(--kraft);color:var(--kraft-ink)}100%{transform:rotate(180deg) scale(1)}}
.inCart::after{animation:popIn .35s var(--spring)}
.bar{transition:box-shadow .3s}
.bar.stuck{box-shadow:0 10px 24px rgba(0,0,0,.45)}
.cat{transition:color .2s,box-shadow .3s,background-color .2s}
.group h2::after{content:"";display:block;width:48px;height:3px;border-radius:2px;background:var(--kraft);margin-top:6px;transform-origin:left;transition:transform .8s var(--ease) .15s}
.group h2.rv:not(.in)::after{transform:scaleX(0)}
.status:not(.closed) i{animation:ping 2.4s infinite}
.skel{height:58px;margin-top:14px}
.skel.h{height:30px;width:40%;margin-top:30px}
.track:not([hidden]){animation:trackIn .5s var(--spring)}
@keyframes trackIn{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translate(-50%,0)}}
.done .big{display:inline-block}
.done .big.pop{animation:popIn .6s var(--spring)}
.stepper{list-style:none;margin:18px 0 6px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.stepper::before,.stepper::after{content:"";position:absolute;left:12.5%;top:15px;height:3px;border-radius:2px}
.stepper::before{right:12.5%;background:var(--line)}
.stepper::after{background:var(--ok);width:calc(75% * var(--p,0));transition:width .9s var(--ease)}
.stepper li{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--label);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);transition:color .3s}
.stepper i{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);display:grid;place-items:center;transition:background-color .4s,border-color .4s,transform .4s var(--spring)}
.stepper i svg{width:16px;height:16px;fill:none;stroke:#0f1a0a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .3s,transform .4s var(--spring)}
.stepper li.done{color:var(--fg)}
.stepper li.done i{background:var(--ok);border-color:var(--ok)}
.stepper li.done i svg{opacity:1;transform:none}
.stepper li.cur{color:var(--kraft)}
.stepper li.cur i{border-color:var(--kraft);background:var(--bg);animation:stepPulse 1.6s infinite}
@keyframes stepPulse{0%{box-shadow:0 0 0 0 rgba(201,162,116,.55)}70%{box-shadow:0 0 0 12px rgba(201,162,116,0)}100%{box-shadow:0 0 0 0 rgba(201,162,116,0)}}
.rateov{position:fixed;inset:0;z-index:72;background:radial-gradient(circle at 50% 30%,rgba(201,162,116,.16),transparent 62%),var(--bg);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .3s;overflow-y:auto}
.rateov.open{opacity:1}
.ratebox{width:min(440px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.rateov.open .ratebox{animation:popIn .6s var(--spring) both}
.ratebox h2{font-family:var(--label);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05}
.ratebox p{margin:0;color:var(--muted)}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{background:transparent;border:0;padding:4px;cursor:pointer;line-height:0}
.stars svg{width:48px;height:48px;fill:var(--surface-2);stroke:var(--line);stroke-width:1.2;transition:fill .25s,stroke .25s,transform .3s var(--spring)}
.stars button.on svg{fill:var(--warn);stroke:var(--warn)}
.stars button.on.pop svg{animation:starPop .5s var(--spring) both;animation-delay:calc(var(--i) * 70ms)}
.stars button:active svg{transform:scale(.85)}
@keyframes starPop{0%{transform:scale(.4) rotate(-30deg)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.ratelbl{font-family:var(--label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);min-height:1.3em}
.ratebox textarea{width:100%;text-align:left}
.ratebox .btn{width:100%}
.ratebox .gbtn{background:#fff;color:#1f1f1f;border-color:#fff;gap:10px}
.ratebox .gbtn svg{width:20px;height:20px}
.ratebox .link{background:transparent;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;padding:6px}
.codebox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0 2px}
.code{display:flex;gap:8px}
.code b{display:grid;place-items:center;width:58px;height:72px;border-radius:12px;background:var(--kraft);color:var(--kraft-ink);font-family:var(--display);font-size:44px;line-height:1;box-shadow:0 8px 24px rgba(201,162,116,.25)}
.codebox.pop .code b{animation:popIn .55s var(--spring) both;animation-delay:calc(var(--i) * 90ms + .1s)}
.codehint{font-family:var(--label);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg)}
.feats li svg,.feats li b{transition:opacity .4s}
.feats li.off svg,.feats li.off b{opacity:.4}
.feats li.off #telLink{display:none}
.feats li.off #fOrderTx{color:var(--warn)}
.stline{font-family:var(--label);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.03em;margin:6px 0 0;min-height:1.4em}
.stline.cancel{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .coverwrap{animation:heroIn 1s var(--spring) both}
  .coverwrap::after{animation:shine 7s 1.4s ease-in-out infinite}
  .tablebadge{animation:popIn .6s .6s var(--spring) both}
  .feats li{animation:fadeUp .6s var(--ease) both}
  .feats li:nth-child(1){animation-delay:.3s}.feats li:nth-child(2){animation-delay:.42s}.feats li:nth-child(3){animation-delay:.54s}
  .hoursbox{animation:fadeUp .6s .66s var(--ease) both}
  .status,.ctas{animation:fadeUp .6s .78s var(--ease) both}
  #ctaMenu{animation:ctaGlow 3.2s 2.2s ease-in-out infinite}
}
@keyframes heroIn{from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:none}}
@keyframes shine{0%{transform:translateX(-130%)}28%,100%{transform:translateX(130%)}}
@keyframes ctaGlow{0%,100%{box-shadow:0 6px 18px rgba(201,162,116,.18)}50%{box-shadow:0 6px 30px rgba(201,162,116,.5)}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero" id="home">
    <h1 class="sr">Imbiss Hirsch – seit 1975</h1>
    <span class="coverwrap"><img class="cover" src="../assets/cover.jpg" width="910" height="550" alt="Imbiss Hirsch seit 1975 – Smash Burger"></span>
    <div id="tableBadge" class="tablebadge" hidden></div>
    <ul class="feats">
      <li>
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="17"/><circle cx="32" cy="32" r="11"/><path d="M8 10v14a4 4 0 0 0 4 4v26M12 10v14M16 10v14a4 4 0 0 1-4 4"/><path d="M54 54V10c-4 2-6 10-6 18 0 4 2 6 6 6"/></svg>
        <div><b id="fWhere"></b><span>Ringstraße 27 · 74321 Bietigheim-Bissingen</span></div>
      </li>
      <li>
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 18h36l4 40H10z"/><path d="M14 18l4-10h28l4 10"/><path d="M26 30l-3-5M23 25l-3 1M26 30l-1-6M38 30l3-5M41 25l3 1M38 30l1-6M27 31h10l-1 5-4 10-4-10z"/></svg>
        <div><b id="fOrder"></b><span><span id="fOrderTx"></span> <a id="telLink" href="tel:0714264439">07142 – 6 44 39</a></span></div>
      </li>
      <li>
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6l5 4 6-1 2 6 6 2-1 6 4 5-4 5 1 6-6 2-2 6-6-1-5 4-5-4-6 1-2-6-6-2 1-6-4-5 4-5-1-6 6-2 2-6 6 1z"/><path d="M24 32l6 6 11-12"/><path d="M20 46l-6 14 8-3 4 7 5-12M44 46l6 14-8-3-4 7-5-12"/></svg>
        <div><b>Tantuni &amp; Burger</b><span id="fFresh"></span></div>
      </li>
    </ul>
    <div class="hoursbox"><span id="hbLbl"></span><span><span id="hbMf"></span>&nbsp; 11:00 – 19:00</span><span><span id="hbSat"></span>&nbsp; 11:00 – 16:00</span></div>
    <div class="status" id="status"><i aria-hidden="true"></i><span id="statusTx"></span></div>
    <div class="ctas">
      <button type="button" class="btn big primary" id="ctaMenu"></button>
      <button type="button" class="btn big" id="ctaInstall" hidden></button>
    </div>
    <p class="ioshint" id="iosHint" hidden></p>
  </header>
</div>

<div class="bar" id="bar">
  <div class="bar-inner">
    <div class="row">
      <nav class="langs" id="langs" aria-label="Sprache / Language"></nav>
      <div class="seg" id="otype" role="group"></div>
    </div>
    <div class="cats" id="cats"></div>
  </div>
</div>

<div class="wrap">
  <div id="offline" class="offline" hidden></div>
  <main id="menu"></main>
  <footer>Imbiss Hirsch · Ringstraße 27 · 74321 Bietigheim-Bissingen</footer>
</div>

<button type="button" class="pill track" id="trackBtn" hidden></button>

<div class="cartbar" id="cartbar" aria-hidden="true">
  <button type="button" id="openCart" tabindex="-1"><span><span class="cnt" id="cartCnt" aria-live="polite">0</span>&nbsp; <span id="cartLbl"></span></span><span id="cartSum" class="num"></span></button>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-in" id="sheetBody"></div>
</div>

<div class="rateov" id="rateOv" role="dialog" aria-modal="true" aria-labelledby="rateTitle" hidden>
  <div class="ratebox" id="rateBox"></div>
</div>

<div class="readyov" id="readyOv" role="alertdialog" aria-labelledby="readyTitle" hidden>
  <div class="readybox">
    <div class="rt" id="readyTitle"></div>
    <div class="rn num" id="readyNo"></div>
    <p id="readyTx"></p>

/* ---------- state ---------- */
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang = "de";
const L = () => LANGS.indexOf(lang);
const tr = (k, vars) => { let s = (T[k] && (T[k][L()] || T[k][0])) || k; if (vars) for (const v in vars) s = s.replace("{"+v+"}", vars[v]); return s; };
const money = v => new Intl.NumberFormat(LOCALE[lang], {style:"currency", currency:"EUR"}).format(v);
const pick = (obj) => obj ? (obj[lang] || obj.de || "") : "";

// table from QR code: ?tisch=5
const params = new URLSearchParams(location.search);
let tableNo = (params.get("tisch") || "").replace(/[^0-9A-Za-z-]/g,"").slice(0,6);
try { if (tableNo) sessionStorage.setItem("ih-table", tableNo); else tableNo = sessionStorage.getItem("ih-table") || ""; } catch(e){}

let deliveryOn = IH.store.get("ih-deliv") !== "0";   // switched in the Dashboard, live
let otype = tableNo ? "tisch" : (store.get("ih-otype") === "lieferung" && deliveryOn ? "lieferung" : "abholung");
const orderTypes = () => (tableNo ? ["tisch"] : []).concat(deliveryOn ? ["abholung","lieferung"] : ["abholung"]);
async function loadSettings(){
  if (!sb) return;
  try{
    const { data } = await sb.from("settings").select("key,value").eq("key", "delivery_enabled").maybeSingle();
    if (data) applyDelivery(data.value !== false);
  }catch(e){}
}
function applyDelivery(on){
  const changed = on !== deliveryOn;
  deliveryOn = on; IH.store.set("ih-deliv", on ? "1" : "0");
  if (!on && otype === "lieferung") otype = "abholung";
  if (changed){ renderChrome(); renderMenu(false); if (sheetMode === "cart") renderCart(); }
}
let cats = [];            // [{id,names,is_drink,items:[{id,names,descs,pp,pd,tag,available}]}]
let online = false;
let cart = {};            // id -> qty
try { cart = JSON.parse(store.get("ih-cart") || "{}") || {}; } catch(e){ cart = {}; }
const saveCart = () => store.set("ih-cart", JSON.stringify(cart));

let onlinePay = false;           // Stripe set up? (asked once on start)
let payChoice = store.get("ih-pay") || "online";
const fnUrl = name => `${IH_CONFIG.url}/functions/v1/${name}`;
const sb = (window.supabase && window.IH_CONFIG) ? window.supabase.createClient(IH_CONFIG.url, IH_CONFIG.key, {auth:{persistSession:false}}) : null;

/* ---------- data ---------- */
async function loadMenu(){
  if (sb){
    try{
      const [c, i] = await Promise.all([
        sb.from("categories").select("id,sort,names,is_drink").order("sort"),
        sb.from("menu_items").select("id,category_id,sort,names,descs,price_pickup,price_delivery,tag,available").order("sort")
      ]);
      if (c.error || i.error) throw (c.error || i.error);
      cats = c.data.map(cat => ({id:cat.id, names:cat.names, is_drink:cat.is_drink,
        items: i.data.filter(x => x.category_id === cat.id).map(x => ({id:x.id, names:x.names, descs:x.descs,
          pp: x.price_pickup == null ? null : +x.price_pickup, pd: x.price_delivery == null ? null : +x.price_delivery, tag:x.tag, available:x.available}))}));
      online = true;
      store.set("ih-menu-cache", JSON.stringify(cats));
      return;
    }catch(e){ console.warn("menu load failed", e); }
  }
  online = false;
  try { cats = JSON.parse(store.get("ih-menu-cache") || "null") || window.IH_FALLBACK_MENU || []; }
  catch(e){ cats = window.IH_FALLBACK_MENU || []; }
}
const allItems = () => cats.flatMap(c => c.items);
const findItem = id => allItems().find(x => x.id === id);
const priceOf = it => otype === "lieferung" ? (it.pd ?? it.pp) : it.pp;
const orderable = it => online && it.id && it.available && it.pp != null;

/* ---------- render ---------- */
function renderChrome(){
  document.documentElement.lang = lang;
  $("fWhere").textContent = tr("where");
  $("fOrder").textContent = tr("orderAlt");
  $("fOrderTx").textContent = deliveryOn ? tr("orderTx2") : tr("delivOff");
  $("fOrder").closest("li").classList.toggle("off", !deliveryOn);
  $("fFresh").textContent = tr("fresh");
  $("hbLbl").textContent = tr("hours") + ":";
  $("hbMf").textContent = tr("monfriL");
  $("hbSat").textContent = tr("sat");
  $("ctaMenu").textContent = tr("ctaMenu");
  $("ctaInstall").textContent = tr("install");
  $("iosHint").textContent = tr("iosHint");
  $("tableBadge").hidden = !tableNo;
  $("tableBadge").textContent = tr("table", {n: tableNo});
  $("langs").innerHTML = LANGS.map(l => `<a class="lang" href="#${l}" aria-current="${l===lang}">${LANG_NAMES[l]}</a>`).join("");
  const types = orderTypes();
  $("otype").innerHTML = types.map(t => `<button type="button" data-t="${t}" aria-pressed="${otype===t}">${esc(t==="tisch" ? tr("table",{n:tableNo}) : t==="abholung" ? tr("pickup") : tr("deliv"))}</button>`).join("");
  $("otype").querySelectorAll("button").forEach(b => b.onclick = () => setType(b.dataset.t));
  requestAnimationFrame(() => IH.seg($("otype")));
  const visible = cats.filter(g => !g.is_drink);
  const firstDrink = cats.find(g => g.is_drink);
  $("cats").innerHTML = visible.map(g => `<button type="button" class="cat" data-target="${esc(g.id)}">${esc(pick(g.names))}</button>`).join("")
    + (firstDrink ? `<button type="button" class="cat" data-target="${esc(firstDrink.id)}">${esc(tr("drinks"))}</button>` : "");
  $("cats").querySelectorAll(".cat").forEach(b => b.onclick = () => document.getElementById("g-"+b.dataset.target)?.scrollIntoView());
  $("offline").hidden = online;
  $("offline").textContent = tr("offline");
  renderStatus();
}

function renderMenu(animate){
  const rv = animate && !IH.reduced ? " data-rv" : "";
  let html = "";
  for (const g of cats){
    html += `<section class="group" id="g-${esc(g.id)}"><h2${rv}>${esc(pick(g.names))}</h2><ul class="items">`;
    for (const it of g.items){
      const name = pick(it.names);
      const orig = (lang !== "de" && it.names.de !== name) ? `<div class="orig">${esc(tr("inDe"))} ${esc(it.names.de)}</div>` : "";
      const desc = it.descs ? `<div class="desc">${esc(pick(it.descs))}</div>` : "";
      let tag = it.tag === "veg" ? `<span class="tag">${esc(tr("veg"))}</span>` : it.tag === "house" ? `<span class="tag house">${esc(tr("house"))}</span>` : "";
      if (!it.available) tag += `<span class="tag out">${esc(tr("soldout"))}</span>`;
      const p = priceOf(it);
      const price = p == null ? `<span class="price ask">${esc(tr("ask"))}</span>` : `<span class="price">${money(p)}</span>`;
      const n = cart[it.id] || 0;
      const btn = orderable(it)
        ? `<button type="button" class="add${n ? " inCart" : ""}" data-id="${it.id}" data-n="${n}" aria-label="${esc(tr("add"))}: ${esc(name)}">+</button>`
        : (online ? `<button type="button" class="add" disabled aria-hidden="true">+</button>` : "");
      html += `<li class="item${it.available ? "" : " soldout"}"${rv}><div class="txt"><div class="line"><span class="name">${esc(name)}${tag}</span><span class="dots" aria-hidden="true"></span>${price}</div>${desc}${orig}</div>${btn}</li>`;
    }
    html += `</ul></section>`;
  }
  html += `
  <div class="info">
    <div><h3>${esc(tr("hours"))}</h3><p>${esc(tr("monfriL"))}: 11:00 – 19:00<br>${esc(tr("sat"))}: 11:00 – 16:00</p></div>
    <div><h3>${esc(tr("orderAlt"))}</h3><p>${esc(tr("orderTx2"))}<br><strong style="font-family:var(--label);font-size:22px">${esc(IH_CONFIG.phone)}</strong></p></div>
  </div>
  <p class="note">${esc(tr("allerg"))}</p>`;
  $("menu").innerHTML = html;
  if (animate) IH.reveal($("menu"));
  $("menu").querySelectorAll(".add[data-id]").forEach(b => b.onclick = () => addToCart(b.dataset.id, b));
  renderCartBar();
  spy();
}

function setType(t){
  otype = t; if (t !== "tisch") store.set("ih-otype", t);
  renderChrome(); renderMenu(false);
  if (!$("sheet").hidden && sheetMode === "cart") renderCart();
}

/* ---------- cart ---------- */
function addToCart(id, btn){
  cart[id] = Math.min(20, (cart[id] || 0) + 1); saveCart();
  const b = btn || document.querySelector(`.add[data-id="${id}"]`);
  if (b){ b.classList.add("inCart"); b.dataset.n = cart[id]; b.classList.remove("added"); void b.offsetWidth; b.classList.add("added"); }
  const wasShown = $("cartbar").classList.contains("show");
  renderCartBar();
  const fly = () => IH.flyTo(b, $("openCart")).then(() => { IH.bump($("cartCnt")); IH.bump($("cartSum")); });
  if (wasShown) fly(); else setTimeout(fly, 250);
}
function cartLines(){
  return Object.entries(cart).map(([id, qty]) => ({it: findItem(id), qty})).filter(l => l.it && orderable(l.it) && l.qty > 0);
}
function cartTotal(){ return cartLines().reduce((s,l) => s + l.qty * priceOf(l.it), 0); }
function renderCartBar(){
  const lines = cartLines(), n = lines.reduce((s,l) => s + l.qty, 0);
  const show = n > 0 && online;
  $("cartbar").classList.toggle("show", show);
  $("cartbar").setAttribute("aria-hidden", String(!show));
  $("openCart").tabIndex = show ? 0 : -1;
  $("cartCnt").textContent = n;
  $("cartLbl").textContent = tr("cart");
  $("cartSum").textContent = money(cartTotal());
}

function captureForm(){
  if ($("fName")) form.name = $("fName").value;
  if ($("fPhone")) form.phone = $("fPhone").value;
  if ($("fAddr")) form.address = $("fAddr").value;
  if ($("fNote")) form.note = $("fNote").value;
}

async function submitOrder(){
  captureForm();
  const lines = cartLines();
  if (!lines.length) return renderCart();
  if (otype !== "tisch" && (!form.name.trim() || !form.phone.trim())) return renderCart(otype === "lieferung" ? tr("needAddr") : tr("needFields"));
  if (otype === "lieferung" && !form.address.trim()) return renderCart(tr("needAddr"));
  if (window.IHSound) IHSound.unlock();   // the tap lets us ring later when the food is ready
  const btn = $("sendBtn"); btn.disabled = true; btn.textContent = tr("sending");
  const payload = {channel: otype, table_no: otype === "tisch" ? tableNo : null, lang,
    name: otype === "tisch" ? null : form.name, phone: otype === "tisch" ? null : form.phone,
    address: otype === "lieferung" ? form.address : null, note: form.note,
    items: lines.map(l => ({id: l.it.id, qty: l.qty}))};
  try{
    const { data, error } = await sb.rpc("place_order", {p: payload});
    if (error) throw error;
    store.set("ih-name", form.name); store.set("ih-phone", form.phone); store.set("ih-address", form.address);
    form.note = ""; cart = {}; saveCart();
    const mine = {id: data.id, token: data.token, channel: otype, code: data.code || null, at: Date.now()};
    store.set("ih-last-order", JSON.stringify(mine));
    renderMenu(false);
    if (onlinePay && payChoice === "online") await startCheckout(mine);
    else showOrder(mine);
  }catch(e){
    if (e && /Lieferung ist gerade nicht/.test(e.message || "")){ applyDelivery(false); renderCart(tr("delivOff")); return; }
    renderCart(tr("orderFail") + (e && e.message ? " " + e.message : ""));
  }
}

    if (d.paid){ o.justPaid = false; pollStatus(o); }
  }catch(e){}
}
async function startCheckout(o){
  const ret = location.origin + location.pathname + (tableNo ? `?tisch=${encodeURIComponent(tableNo)}` : "");
  try{
    const r = await fetch(fnUrl("create-checkout"), {method:"POST", headers:{"Content-Type":"application/json", apikey: IH_CONFIG.key},
      body: JSON.stringify({id: o.id, token: o.token, return_url: ret, lang})});

async function pollStatus(o){
  clearTimeout(pollTimer);
  let st = null, pay = "offen";
  try{
    const { data } = await sb.rpc("order_status", {p_id: o.id, p_token: o.token});
    st = data && data.status; pay = (data && data.payment) || "offen";
    if (data && data.code && !o.code) o.code = data.code;
  }catch(e){}
  if (st){
    const prev = o.lastSt; o.lastSt = st; o.pay = pay;
    store.set("ih-last-order", JSON.stringify(o));
    renderTrack(o, st);
    if (st === "fertig" && prev && prev !== "fertig") readyAlarm(o);
    const el = $("steps");
    if (el && sheetMode === "order"){
      const label = st === "fertig" ? (o.channel === "lieferung" ? tr("readyDeliv") : tr("readyPick"))
        : st === "neu" ? (pay === "offen" ? (o.justPaid ? tr("payWait") : o.channel === "lieferung" ? tr("st_neu") : tr("payFirst")) : tr("st_paid"))
        : tr("st_" + st);
      el.textContent = label;
      el.classList.toggle("cancel", st === "storniert");
      paintStepper(st, pay);
      const pa = $("payArea");
      if (pa){
        if (pay === "offen" && onlinePay && st !== "storniert" && !o.justPaid){
          if (!pa.dataset.on){ pa.dataset.on = "1";
            pa.innerHTML = `<button type="button" class="btn big primary" id="payNowBtn" style="margin-top:14px">${esc(tr("payNow"))}</button><p class="hint" style="margin-top:6px">${esc(tr("orCounter"))}</p>`;
            $("payNowBtn").onclick = (e) => { e.currentTarget.disabled = true; startCheckout(o); };
          }
        } else { pa.innerHTML = ""; delete pa.dataset.on; }
      }
    }
    if (o.justPaid && pay === "offen"){ o.tries = (o.tries || 0) + 1; if (o.tries % 2 === 0 && o.tries <= 24) confirmPay(o); }
    if (pay !== "offen") o.justPaid = false;
    if (st === "storniert") return;
    if (st === "abgeschlossen"){ if (!store.get("ih-rated-" + o.id)) showRating(o); else store.del("ih-last-order"); return; }
  }
  pollTimer = setTimeout(() => pollStatus(o), 5000);
}
function paintStepper(st, pay){
  const sp = $("stepper"); if (!sp) return;
  const paid = pay && pay !== "offen";
  const cur = (st === "fertig" || st === "abgeschlossen") ? 4 : (st === "zubereitung" || paid) ? 2 : 1;
  sp.style.setProperty("--p", cur >= 4 ? 1 : (cur - 1 + (st === "zubereitung" ? 0.5 : 0)) / 3);
  [...sp.children].forEach((li, i) => {
    const wasDone = li.classList.contains("done");
    li.classList.toggle("done", i < cur);
    li.classList.toggle("cur", i === cur && st !== "storniert");
    if (!wasDone && i < cur && !IH.reduced) li.querySelector("i").animate([{transform:"scale(.6)"},{transform:"scale(1.2)"},{transform:"scale(1)"}], {duration:450, easing:"cubic-bezier(.34,1.56,.64,1)", delay: i * 120});
  });
}

/* ---------- open / closed ---------- */
const HOURS = {1:[11,19],2:[11,19],3:[11,19],4:[11,19],5:[11,19],6:[11,16]};
function renderStatus(){
  let wd, mins;
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Berlin",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday); mins = (+p.hour)*60 + (+p.minute);
  }catch(e){ const d = new Date(); wd = d.getDay(); mins = d.getHours()*60 + d.getMinutes(); }
  const h = HOURS[wd], el = $("status");
  if (h && mins >= h[0]*60 && mins < h[1]*60){ el.classList.remove("closed"); $("statusTx").textContent = tr("openNow",{t: h[1] + ":00"}); return; }
  let k = (h && mins < h[0]*60) ? 0 : 1;
  while (!HOURS[(wd + k) % 7]) k++;
  const d = k === 0 ? tr("today") : k === 1 ? tr("tomorrow") : new Intl.DateTimeFormat(LOCALE[lang],{weekday:"long",timeZone:"Europe/Berlin"}).format(new Date(Date.now() + k*864e5));
  el.classList.add("closed"); $("statusTx").textContent = tr("closedNow",{d});
}
setInterval(renderStatus, 60000);

function detectLang(){

  if (saved && LANGS.includes(saved)) return saved;
  const nav = (navigator.languages || [navigator.language || "de"]).map(x => x.slice(0,2).toLowerCase());
  return nav.find(x => LANGS.includes(x)) || "de";
}
function route(animate = true){
  const h = location.hash.replace("#","").toLowerCase();
  if (LANGS.includes(h)) { lang = h; store.set("ih-lang", h); }
  renderChrome(); renderMenu(animate);
  if (sheetMode === "cart") renderCart();
}
addEventListener("hashchange", () => route(true));

(async function start(){
  lang = detectLang();
  const hh = location.hash.replace("#","").toLowerCase(); if (LANGS.includes(hh)) lang = hh;
  IH.splash("../assets/logo.jpg", "Tantuni & Burger");
  renderChrome();
  $("menu").innerHTML = `<div class="skeleton skel h"></div>` + Array.from({length:5}, () => `<div class="skeleton skel"></div>`).join("");
  const loaded = Promise.all([loadMenu(), loadSettings()]);
  const quick = await Promise.race([loaded.then(() => true), new Promise(r => setTimeout(() => r(false), 4000))]);
  if (!quick){ cats = window.IH_FALLBACK_MENU || []; route(true); await loaded; route(false); }
  else route(true);
  // live menu: sold-out switches and prices update without reload
  if (sb && online){
    sb.channel("menu").on("postgres_changes", {event:"*", schema:"public", table:"menu_items"}, async () => { await loadMenu(); route(false); })
      .on("postgres_changes", {event:"*", schema:"public", table:"settings"}, p => { if (p.new && p.new.key === "delivery_enabled") applyDelivery(p.new.value !== false); })
      .subscribe();
    setInterval(loadSettings, 60000);
  }
  await checkOnlinePay();
  const back = params.get("bezahlt") || params.get("abbruch");
  if (back){
    const clean = location.pathname + (tableNo ? `?tisch=${encodeURIComponent(tableNo)}` : "") + location.hash;
    try{ history.replaceState(null, "", clean); }catch(e){}
  }
  try{
    const last = JSON.parse(store.get("ih-last-order") || "null");
    if (last && Date.now() - last.at < 6*3600e3 && sb){
      if (back && String(last.id) === back){
        if (params.get("bezahlt")){ last.justPaid = true; last.tries = 0; confirmPay(last); }
        showOrder(last, params.get("abbruch") ? tr("payCancel") : "");
      } else pollStatus(last);
    } else store.del("ih-last-order");
  }catch(e){}
})();

IH.registerSW("../sw.js");
</script>
</body>
