<style>
/* Dashboard: sidebar navigation on wide screens, bottom bar on phones. Overview reads top-down: KPIs → when → what → list. */
:root{--app:var(--info)}
.layout{flex:1;min-height:0;display:flex}
.side{flex:none;width:220px;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;margin-left:calc(-1 * var(--gut-l));padding-left:max(10px,env(safe-area-inset-left,0px));overflow-y:auto}
.side a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--muted);font-family:var(--label);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px;border-radius:10px;position:relative;transition:color .2s,background-color .2s}
.side a:hover{color:var(--fg)}
.side a[aria-current="page"]{color:var(--fg);background:var(--surface)}
.side a[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--app);animation:growY .35s var(--ease)}
.side svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .grp{font-family:var(--label);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:16px 12px 4px}
.layout .content{margin-inline:0 calc(-1 * var(--gut-r))}
@media (max-width:760px){.side{display:none}.layout .content{margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r))}}

.daynav{display:flex;align-items:center;gap:6px}
.daynav input{max-width:170px;font-size:15px;font-family:var(--body);letter-spacing:0;padding:9px 10px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--ok);text-transform:uppercase}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(127,168,217,.10),transparent 70%)}
.kpi .k{font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--label);font-weight:700;font-size:clamp(26px,6.4vw,36px);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi .d{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:13px;font-weight:500;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--muted)}
.kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.box h3{font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;display:flex;align-items:baseline;gap:8px}
.box h3 small{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);font-size:13px;margin-left:auto}
.bars{display:grid;gap:6px;align-items:end;height:170px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 41px,rgba(255,255,255,.04) 41px 42px)}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:linear-gradient(to top,rgba(201,162,116,.55),var(--kraft));min-height:2px;transform-origin:bottom}
.bars .b.today i{background:linear-gradient(to top,rgba(127,168,217,.5),var(--info))}
.bars .b em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grow .bars .b i{animation:growY .8s var(--ease) both;animation-delay:calc(var(--i) * 55ms)}
.axis{display:grid;gap:6px;margin-top:6px}
.axis span{font-size:11px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.split i{display:block;height:100%;transform-origin:left}
.grow .split i{animation:growX .9s var(--ease) both}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{font-variant-numeric:tabular-nums;font-weight:500}
.splits{display:grid;gap:18px}
.toplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toplist li{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:15px;position:relative;padding:5px 9px;border-radius:8px;overflow:hidden}
.toplist li i{position:absolute;inset:0 auto 0 0;background:rgba(201,162,116,.16);z-index:0;transform-origin:left}
.grow .toplist li i{animation:growX .9s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
.toplist li span,.toplist li b{position:relative;z-index:1}
.toplist b{font-variant-numeric:tabular-nums;font-weight:500}
.dl{display:grid;gap:6px}
.dl-row{display:grid;grid-template-columns:64px 60px 1fr auto auto;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.dl-row .x1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.dl-row{grid-template-columns:56px 1fr auto}.dl-row .hide-s{display:none}}

/* delivery switch */
.svc{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:16px;padding:14px 16px;margin-bottom:16px;transition:border-color .4s,background-color .4s}
.svc.on{border-left-color:var(--ok)}
.svc .ico{width:34px;height:34px;flex:none;fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.svc.on .ico{stroke:var(--ok)}
.svc.on .ico{animation:drive 2.6s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.svc .t{flex:1;min-width:0;display:flex;flex-direction:column}
.svc b{font-family:var(--label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.svc span{color:var(--muted);font-size:14px}
.switch.big{width:64px;height:36px;border-radius:18px}
.switch.big::after{width:30px;height:30px}
.switch.big[aria-checked="true"]::after{transform:translateX(28px)}

/* reviews */
.rstars{letter-spacing:2px;font-size:16px}
.rstars em{font-style:normal;color:#4a453f}
.rstars em.on{color:var(--warn)}
.revlist{display:grid;gap:10px;max-height:520px;overflow-y:auto}
.rev{background:var(--bg);border-radius:12px;padding:10px 12px}
.rev .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.rev p{margin:6px 0 0;font-size:15px;white-space:pre-wrap}

/* menu editor */
.mtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mtools input{max-width:320px}
.mcat{margin-bottom:26px}
.mcat h3{font-family:var(--label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.mcat h3 .sp{flex:1}.mcat h3 .btn.ghost{padding:6px 12px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px 70px 140px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);transition:background-color .3s}
.mrow.saved{animation:savedFlash 1s ease}
@keyframes savedFlash{30%{background:rgba(127,191,95,.12)}}
.mrow .nm{min-width:0}
.mrow .nm b{font-family:var(--label);font-weight:600;font-size:17px;text-transform:uppercase;display:block}
.mrow .nm small{color:var(--faint);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow input[type=number]{padding:8px;text-align:right;font-variant-numeric:tabular-nums}
.mhead{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px 70px 140px;gap:10px;color:var(--faint);font-size:12px;font-family:var(--label);letter-spacing:.1em;text-transform:uppercase}
.mhead span:nth-child(n+2){text-align:center}
.switch{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:#3a2620;cursor:pointer;justify-self:center;transition:background-color .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#c9b9ad;transition:transform .35s var(--spring),background-color .3s}
.switch[aria-checked="true"]{background:#36502a}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:#cfe8bf}
@media (max-width:640px){
  .mhead{display:none}
  .mrow{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"nm nm nm" "pp pd av" "ed ed ed"}
  .mrow .nm{grid-area:nm}.mrow .pp{grid-area:pp}.mrow .pd{grid-area:pd}.mrow .av{grid-area:av}.mrow .ed{grid-area:ed;justify-self:start}
  .mrow .pp::before{content:"Abholen"}.mrow .pd::before{content:"Liefern"}
}
.mini{display:flex;flex-direction:column;gap:2px}
.mini::before{font-size:11px;color:var(--faint);font-family:var(--label);letter-spacing:.1em;text-transform:uppercase}
.dialog .grid{display:grid;gap:12px}
.lgrid{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:center}
.lgrid .lc{font-family:var(--label);font-weight:700;color:var(--muted);letter-spacing:.08em}
.dialog .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dialog .actions .sp{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.g2{grid-template-columns:1fr}}

/* QR */
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.qcard{background:#f6f2ea;color:#111;border-radius:14px;overflow:hidden;text-align:center;display:flex;flex-direction:column}
.qcard .top{background:#0d0c0b;padding:10px}
.qcard .top img{width:80%;height:auto}
.qcard .qr{display:flex;justify-content:center;margin:12px auto 6px;background:#fff;padding:6px;width:fit-content}
.qcard .qr img,.qcard .qr canvas{width:150px!important;height:150px!important}
.qcard .tn{font-family:var(--label);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:#7a5a33}
.qcard .ll{font-family:var(--label);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.qcard .btn{margin:0 10px 10px;background:#111;color:#f6f2ea;border-color:#111}

/* team + apps */
.team{display:grid;gap:8px;margin-top:12px}
.trow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.trow .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.appcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .25s var(--ease),border-color .25s}
.appcard:hover{transform:translateY(-3px);border-color:#4a453f}
.appcard .h{display:flex;align-items:center;gap:12px}
.appcard img{width:56px;height:56px;border-radius:14px}
.appcard b{font-family:var(--label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.appcard p{margin:0;color:var(--muted);font-size:14px;flex:1}
.appcard code{font-size:12px;color:var(--faint);word-break:break-all}
.appcard .row{display:flex;gap:8px;flex-wrap:wrap}
.sup .row{display:flex;gap:8px;flex-wrap:wrap}
.supname{font-family:var(--label);font-weight:700;font-size:22px;text-transform:uppercase;margin:4px 0 12px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}
.vrow b{font-family:var(--label);font-size:17px;display:block}
.vrow span{display:block;color:var(--muted);font-size:13px}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:500}
.faq p{color:var(--muted);margin:8px 0 0}
</style>
</head>

<div class="dialog" id="dialog" role="dialog" aria-modal="true" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/ih.js"></script>
<script src="../shared/staff.js"></script>
<script>
const { $, esc, eur, hhmm, where, CH, SRC, ST, PAY, PM, store } = IH;
const LANGS = ["de","en","it","tr","fr"];
let sb, me, staff, cats = [], items = [], current = null, CID = IH.CID, logoImg = null;
const B = () => IH.BRAND || IH.BRAND_DEFAULT;
let deliveryOn = true;

IH.splash((IH.brandCached(IH.store.get("ih-last-client") || IH.CID) || IH.BRAND_DEFAULT).logo_url || "../assets/logo.jpg", "Dashboard");
IH.staffGate({ app: "Dashboard", onReady: async (ctx) => {
  ({ sb, me, staff } = ctx); CID = ctx.client;
  logoImg = brandImg();
  if (staff.platform) IH.toast("Plattform-Modus: " + B().name);
  await Promise.all([loadMenu(), loadSettings()]);
  subscribe();
  route();
}});

/* ---------- dialog ---------- */
function openDialog(html){ $("dialog").innerHTML = html; IH.open($("dialog"), $("scrim")); }
function closeDialog(){ IH.close($("dialog"), $("scrim"), () => $("dialog").innerHTML = ""); }
$("scrim").onclick = closeDialog;
addEventListener("keydown", e => { if (e.key === "Escape" && !$("dialog").hidden) closeDialog(); });

/* ---------- data ---------- */
async function loadMenu(){
  const [c, i] = await Promise.all([sb.from("categories").select("*").eq("client_id", CID).order("sort"), sb.from("menu_items").select("*").eq("client_id", CID).order("sort")]);
  if (c.error || i.error) return IH.toast("Speisekarte konnte nicht geladen werden", "err");
  cats = c.data; items = i.data;
}
async function loadSettings(){
  const { data } = await sb.from("settings").select("key,value").eq("client_id", CID).eq("key", "delivery_enabled").maybeSingle();
  if (data) deliveryOn = data.value !== false;
}
function deliveryCard(){
  return `<div class="svc${deliveryOn ? " on" : ""}" id="svc">
    <svg class="ico" viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    <div class="t"><b>Lieferservice</b><span id="svcTx">${deliveryOn ? "Aktiv – Gäste können per QR Lieferung bestellen" : "Pausiert – Gäste sehen nur Abholen und Tisch"}</span></div>
    <button type="button" class="switch big" role="switch" id="svcSw" aria-checked="${deliveryOn}" aria-label="Lieferservice an/aus"></button>
  </div>`;
}
function wireDelivery(){
  const sw = $("svcSw"); if (!sw) return;
  sw.onclick = async () => {
    const val = !deliveryOn;
    deliveryOn = val; paintDelivery();
    // update this restaurant's row; insert only if it does not exist yet (never touches another restaurant)
    let { data: upd, error } = await sb.from("settings").update({ value: val }).eq("client_id", CID).eq("key", "delivery_enabled").select("key");
    if (!error && !(upd && upd.length)) ({ error } = await sb.from("settings").insert({ client_id: CID, key: "delivery_enabled", value: val }));

function route(){

  const topList = Object.entries(top).sort((a, b) => b[1].q - a[1].q).slice(0, 8);

  const paySplit = [["bar","Bar","var(--kraft)"],["karte","Karte","var(--info)"],["online","Online","var(--ok)"],["offen","Offen (Lieferung)","var(--warn)"]].map(([k, l, c]) => ({ l, c, n: sum(ok.filter(o => o.payment !== "offen" && payKey(o) === k)) }));

function deliveriesBox(all){
  const d = all.filter(o => o.channel === "lieferung" && o.status !== "storniert");
  if (!d.length) return "";
  const st = o => o.status === "abgeschlossen" ? "zugestellt" : o.status === "unterwegs" ? "unterwegs" : o.status === "fertig" ? "bereit" : o.payment === "offen" ? "offen" : "kueche";

  const n = k => d.filter(o => st(o) === k).length;
  const delivered = d.filter(o => o.delivered_at && o.eta_at);
  const onTime = delivered.filter(o => new Date(o.delivered_at) <= new Date(o.eta_at)).length;
  const rows = d.slice().reverse().map(o => {
    const k = st(o);
    let when = "";
    if (o.delivered_at){
      const diff = o.eta_at ? Math.round((new Date(o.delivered_at) - new Date(o.eta_at)) / 60000) : null;
      when = `${hhmm(o.delivered_at)}${diff === null ? "" : diff <= 0 ? ` <span style="color:var(--ok)">pünktlich</span>` : ` <span style="color:var(--bad)">+${diff} min</span>`}`;
    } else if (o.eta_at) when = `bis ${hhmm(o.eta_at)}`;
    const pay = o.payment === "bei_lieferung" || o.payment === "offen" ? ` · <span style="color:var(--warn)">${eur(o.total)} offen</span>` : o.status === "abgeschlossen" ? ` · ${o.payment === "bar" ? "bar kassiert" : o.payment === "karte" ? "Karte kassiert" : "online bezahlt"}` : "";
    return `<div class="dl-row"><b>${o.pickup_code || "#" + o.id}</b><span class="num">${hhmm(o.created_at)}</span><span class="x1">${esc(o.address || "")}${o.driver_email ? " · " + esc(o.driver_email.split("@")[0]) : ""}${pay}</span><span class="pill ${L[k][1]} hide-s">${L[k][0]}</span><span class="num">${when}</span></div>`;
  }).join("");
  return `<div class="box" style="margin-top:16px"><h3>Lieferungen heute<small>${d.length} · ${n("zugestellt")} zugestellt · ${n("unterwegs")} unterwegs${delivered.length ? ` · ${Math.round(onTime / delivered.length * 100)} % pünktlich` : ""}</small></h3><div class="dl">${rows}</div></div>`;
}

function editCat(c){
  const isNew = !c;
  c = c || { names: {}, is_drink: false, sort: cats.length ? Math.max(...cats.map(x => x.sort || 0)) + 1 : 0 };
  openDialog(`<h3>${isNew ? "Neue Kategorie" : esc(c.names.de)}<button class="x" type="button" id="dX" aria-label="Schließen">×</button></h3>
    <div class="grid">
      <div class="field"><span class="lbl">Name (DE ist Pflicht)</span><div class="lgrid">${LANGS.map(l => `<span class="lc">${l.toUpperCase()}</span><input type="text" data-n="${l}" value="${esc(c.names?.[l] || "")}">`).join("")}</div></div>
      <div class="g2"><div class="field"><label for="cSort">Position</label><input id="cSort" type="number" min="0" step="1" value="${c.sort ?? 0}"></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:24px"><input type="checkbox" id="cDrink" ${c.is_drink ? "checked" : ""}> Getränke-Kategorie</label></div>
      <p class="err" id="cErr" hidden></p>
    </div>
    <div class="actions">${!isNew && staff.is_admin && !items.some(i => i.category_id === c.id) ? `<button class="btn danger" type="button" id="cDel">Löschen</button>` : ""}<span class="sp"></span>
      <button class="btn" type="button" id="cCancel">Abbrechen</button><button class="btn primary" type="button" id="cSave">Speichern</button></div>`);
  $("dX").onclick = closeDialog; $("cCancel").onclick = closeDialog;
  const fail = m => { $("cErr").textContent = m; $("cErr").hidden = false; };
  $("cSave").onclick = async () => {
    const names = {}; $("dialog").querySelectorAll("[data-n]").forEach(i => { const v = i.value.trim(); if (v) names[i.dataset.n] = v; });
    if (!names.de) return fail("Bitte den deutschen Namen eintragen.");
    const row = { names, is_drink: $("cDrink").checked, sort: parseInt($("cSort").value || "0", 10) };
    let error;
    if (isNew){
      // ids stay unique across all restaurants
      let id = (CID === IH.DEFAULT_CLIENT ? "" : CID + "-") + (IH.slug(names.de) || "kat"), n = 2;
      while (cats.some(x => x.id === id)) id = id.replace(/-\d+$/, "") + "-" + n++;
      ({ error } = await sb.from("categories").insert({ ...row, id, client_id: CID }));
    } else ({ error } = await sb.from("categories").update(row).eq("client_id", CID).eq("id", c.id));
    if (error) return fail(error.message);
    closeDialog(); IH.toast("Gespeichert"); await loadMenu(); renderMenuEditor();
  };
  if ($("cDel")) $("cDel").onclick = async (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Wirklich löschen?"; IH.bump(b); return; }
    const { error } = await sb.from("categories").delete().eq("client_id", CID).eq("id", c.id);
    if (error) return fail(error.message);
    closeDialog(); IH.toast("Gelöscht"); await loadMenu(); renderMenuEditor();
  };
}
function editItem(it, catId){
  const isNew = !it;
  it = it || { names: {}, descs: {}, category_id: catId, tag: null, sort: items.filter(i => i.category_id === catId).length, available: true, price_pickup: null, price_delivery: null };
  const lrow = (k, obj, ml) => LANGS.map(l => `<span class="lc">${l.toUpperCase()}</span>${ml ? `<textarea rows="2" data-${k}="${l}">${esc(obj?.[l] || "")}</textarea>` : `<input type="text" data-${k}="${l}" value="${esc(obj?.[l] || "")}">`}`).join("");
  openDialog(`<h3>${isNew ? "Neues Gericht" : esc(it.names.de)}<button class="x" type="button" id="dX" aria-label="Schließen">×</button></h3>
    <div class="grid">
      <div class="g2">
        <div class="field"><label for="eCat">Kategorie</label><select id="eCat">${cats.map(c => `<option value="${esc(c.id)}" ${c.id === it.category_id ? "selected" : ""}>${esc(c.names.de)}</option>`).join("")}</select></div>
        <div class="field"><label for="eTag">Kennzeichnung</label><select id="eTag"><option value="">–</option><option value="veg" ${it.tag === "veg" ? "selected" : ""}>Vegetarisch</option><option value="house" ${it.tag === "house" ? "selected" : ""}>Hausspezialität</option></select></div>
        <div class="field"><label for="ePP">Preis Abholen / vor Ort €</label><input id="ePP" type="number" step="0.10" min="0" value="${it.price_pickup ?? ""}"></div>
        <div class="field"><label for="ePD">Preis Liefern €</label><input id="ePD" type="number" step="0.10" min="0" value="${it.price_delivery ?? ""}"></div>
      </div>
      <div class="field"><span class="lbl">Name (DE ist Pflicht; leere Sprachen zeigen den deutschen Namen)</span><div class="lgrid">${lrow("n", it.names, false)}</div></div>
      <div class="field"><span class="lbl">Beschreibung</span><div class="lgrid">${lrow("d", it.descs, true)}</div></div>
      <div class="field"><label for="eSort">Position in der Kategorie</label><input id="eSort" type="number" min="0" step="1" value="${it.sort ?? 0}" style="max-width:120px"></div>
      <p class="err" id="eErr" hidden></p>
    </div>
    <div class="actions">
      ${!isNew && staff.is_admin ? `<button class="btn danger" type="button" id="eDel">Löschen</button>` : ""}
      <span class="sp"></span>
      <button class="btn" type="button" id="eCancel">Abbrechen</button>
      <button class="btn primary" type="button" id="eSave">Speichern</button>
    </div>`);
  $("dX").onclick = closeDialog; $("eCancel").onclick = closeDialog;
  const fail = m => { $("eErr").textContent = m; $("eErr").hidden = false; };
  $("eSave").onclick = async () => {
    const names = {}, descs = {};
    $("dialog").querySelectorAll("[data-n]").forEach(i => { const v = i.value.trim(); if (v) names[i.dataset.n] = v; });
    $("dialog").querySelectorAll("[data-d]").forEach(i => { const v = i.value.trim(); if (v) descs[i.dataset.d] = v; });
    if (!names.de) return fail("Bitte mindestens den deutschen Namen eintragen.");
    const num = v => v === "" ? null : Math.round(parseFloat(v.replace(",", ".")) * 100) / 100;
    const row = { client_id: CID, category_id: $("eCat").value, tag: $("eTag").value || null, price_pickup: num($("ePP").value), price_delivery: num($("ePD").value),
      names, descs: Object.keys(descs).length ? descs : null, sort: parseInt($("eSort").value || "0", 10) };
    const { error } = isNew ? await sb.from("menu_items").insert(row) : await sb.from("menu_items").update(row).eq("id", it.id);
    if (error) return fail(error.message);
    closeDialog(); IH.toast("Gespeichert"); await loadMenu(); renderMenuEditor();
  };
  if ($("eDel")) $("eDel").onclick = async (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Wirklich löschen?"; IH.bump(b); return; }
    const { error } = await sb.from("menu_items").delete().eq("id", it.id);
    if (error) return fail(error.message);
    closeDialog(); IH.toast("Gelöscht"); await loadMenu(); renderMenuEditor();
  };
}

/* ========== QR CODES ========== */
const kundeUrl = () => IH.withL(new URL("../kunde/", location.href).href, CID);
function brandImg(){ const im = new Image(); const u = B().logo_url || "../assets/logo.jpg"; if (/^https?:/.test(u)) im.crossOrigin = "anonymous"; im.src = u; return im; }
function renderQR(){
  // the saved address belongs to one restaurant only
  let base = store.get(IH.key("ih-base2", CID)) || kundeUrl();
  if (CID !== IH.DEFAULT_CLIENT && !base.includes("l=" + CID)) base = kundeUrl();
  const n = +(store.get("ih-tables") || 10);
  $("v-qr").innerHTML = `<h2 class="view">QR-Codes</h2>
    <p class="muted" style="margin-top:0;max-width:70ch">Jeder Tisch bekommt seinen eigenen Code. Gäste sehen die Karte in ihrer Sprache, bestellen an ihren Tisch und die Tischnummer erscheint auf der Abhol-Anzeige. Druckgröße: ca. 5 × 5 cm.</p>
    <div class="g2" style="max-width:680px"><div class="field"><label for="qBase">Adresse der Kunden-App</label><input id="qBase" type="url" value="${esc(base)}"></div>
    <div class="field"><label for="qN">Anzahl Tische</label><input id="qN" type="number" min="1" max="60" value="${n}"></div></div>
    <div class="qrgrid" id="qGrid"></div>`;
  const draw = () => {
    const b = $("qBase").value.trim().replace(/#.*$/, ""), k = Math.max(1, Math.min(60, +$("qN").value || 1));
    store.set(IH.key("ih-base2", CID), b); store.set("ih-tables", k);
    const sep = b.includes("?") ? "&" : "?";
    const cards = [{ label: "Abholen & Liefern", url: b }].concat(Array.from({ length: k }, (_, i) => ({ label: `Tisch ${i + 1}`, url: `${b}${sep}tisch=${i + 1}` })));
    $("qGrid").innerHTML = cards.map((c, i) => `<div class="qcard" data-rv><div class="top"><img src="${esc(B().logo_url || "../assets/logo.jpg")}" alt=""></div><div class="qr" id="qr${i}"></div><div class="tn">${esc(c.label)}</div><div class="ll">Speisekarte · Menu · Menü</div><button class="btn" type="button" data-dl="${i}">Als Bild speichern</button></div>`).join("");
    cards.forEach((c, i) => new QRCode($("qr" + i), { text: c.url, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M }));
    IH.reveal($("qGrid"));
    $("qGrid").querySelectorAll("[data-dl]").forEach(btn => btn.onclick = () => saveCard(cards[+btn.dataset.dl], $("qr" + btn.dataset.dl)));
  };
  $("qBase").onchange = draw; $("qN").onchange = draw; draw();
}
function saveCard(card, qrBox){
  const W = 800, H = 1100, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#f6f2ea"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#0d0c0b"; g.fillRect(0, 0, W, 380);
  if (logoImg && logoImg.complete && logoImg.naturalWidth){ const k = Math.min(640 / logoImg.naturalWidth, 320 / logoImg.naturalHeight), lw = logoImg.naturalWidth * k, lh = logoImg.naturalHeight * k; try { g.drawImage(logoImg, (W - lw) / 2, (380 - lh) / 2, lw, lh); } catch (e) {} }
  const q = qrBox.querySelector("canvas") || qrBox.querySelector("img");
  g.fillStyle = "#fff"; g.fillRect(200 - 16, 430 - 16, 432, 432);
  g.drawImage(q, 200, 430, 400, 400);
  g.fillStyle = "#7a5a33"; g.textAlign = "center"; g.font = "700 64px 'Barlow Condensed', Arial Narrow, sans-serif";
  g.fillText(card.label.toUpperCase(), W / 2, 930);
  g.fillStyle = "#111"; g.font = "600 30px 'Barlow Condensed', Arial Narrow, sans-serif";
  g.fillText("SPEISEKARTE · MENU · MENÜ · MENÙ", W / 2, 990);
  g.fillStyle = "#555"; g.font = "500 24px 'Barlow', Arial, sans-serif";
  g.fillText("Scannen · bestellen · bezahlen", W / 2, 1040);
  c.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${CID}-qr-${card.label.toLowerCase().replace(/[^a-z0-9]+/g, "-")}.png`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }, "image/png");
  IH.toast("Bild gespeichert");
}

/* ========== TEAM ========== */
function renderTeam(){
  const V = $("v-team");
  if (!staff.is_admin){ V.innerHTML = `<h2 class="view">Team</h2><div class="empty">Nur Admins können Mitarbeiter verwalten.</div>`; return; }
  V.innerHTML = `<h2 class="view">Team</h2>
    <p class="muted" style="margin-top:0;max-width:70ch">Neue Mitarbeiter öffnen Kasse, Küche oder Dashboard und tippen auf „Konto erstellen“. Danach trägst du hier ihre E-Mail ein. Ein Login gilt für alle Personal-Apps.</p>
    <div class="g2" style="max-width:680px;align-items:end"><div class="field"><label for="tEmail">E-Mail des Mitarbeiters</label><input id="tEmail" type="email"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="tAdmin"> Admin</label><button class="btn primary" type="button" id="tAdd">Freischalten</button></div></div>
    <div class="team" id="tList"></div>`;
  $("tAdd").onclick = async () => {
    const { error } = await sb.rpc("add_staff", { p_email: $("tEmail").value, p_admin: $("tAdmin").checked, p_client: CID });
    if (error) return IH.toast(error.message, "err");
    IH.toast("Freigeschaltet"); $("tEmail").value = ""; loadTeam();
  };
  loadTeam();
}
async function loadTeam(){
  const { data } = await sb.from("staff").select("*").eq("client_id", CID).order("created_at");
  IH.flip("#tList", () => {
    $("tList").innerHTML = (data || []).map(s => `<div class="trow" data-k="${s.user_id}"><span class="em">${esc(s.email || s.user_id)}</span>${s.is_admin ? `<span class="pill">Admin</span>` : ""}
      ${s.user_id === me.id ? `<span class="muted">Du</span>` : `<button class="btn danger" type="button" data-rm="${s.user_id}">Entfernen</button>`}</div>`).join("");
  });
  $("tList").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Wirklich entfernen?"; IH.bump(b); return; }
    const { error } = await sb.from("staff").delete().eq("user_id", b.dataset.rm);
    if (error) return IH.toast(error.message, "err");
    loadTeam();
  });
}

    ["kasse", "Kasse", "Bestellungen kassieren (Bar, Karte, Lieferung), an die Küche geben, ausgeben. Telefon- und WhatsApp-Bestellungen erfassen.", "../kasse/"],

    ["fahrer", "Fahrer", "Für die Lieferfahrer: fertige Lieferungen, Adresse mit einem Tipp in Google Maps, „Losfahren“ und „Zugestellt / Bar kassiert“.", "../fahrer/"],
    ["abholung", "Abhol-Anzeige", "Für den TV im Gastraum: „Bitte abholen“ mit Bestell- und Tischnummer, Alarmton. Ohne Login.", IH.withL("../abholung/", CID)],
    ["dashboard", "Dashboard", "Umsatz und Auswertung, Speisekarte und Preise, QR-Codes, Team.", "./"],

    <p class="muted" style="margin-top:0;max-width:70ch">Jede App einzeln auf dem passenden Gerät öffnen und installieren: iPhone → Teilen → „Zum Home-Bildschirm“, Android → Menü → „App installieren“.</p>
    <div class="apps">${A.map(([k, n, d, u]) => { const url = new URL(u, location.href).href; return `<div class="appcard" data-rv>
      <div class="h"><img src="../assets/icons/${k}-192.png" alt=""><b>${n}</b></div><p>${d}</p><code>${esc(url)}</code>
      <div class="row"><a class="btn primary" href="${u}" ${k === "dashboard" ? "" : `target="_blank" rel="noopener"`}>Öffnen</a><button class="btn" type="button" data-copy="${esc(url)}">Link kopieren</button></div></div>`; }).join("")}</div>`;
  IH.reveal($("v-apps"));
  $("v-apps").querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); IH.toast("Link kopiert"); }
    catch (e) { IH.toast(b.dataset.copy); }
  });
}

/* ========== SUPPORT & VERTRAG ========== */
async function renderSupport(){
  const V = $("v-support");
  V.innerHTML = `<h2 class="view">Support</h2><div class="grid2"><div class="box skeleton" style="height:180px"></div><div class="box skeleton" style="height:180px"></div></div>`;
  const [s, k] = await Promise.all([sb.rpc("get_support"), sb.from("contracts").select("id,terms,signer_name,signed_at,pdf_path").eq("client_id", CID).order("signed_at", { ascending: false })]);
  const sup = s.data || {}, list = k.data || [];
  const tel = String(sup.phone || "").replace(/[^0-9+]/g, ""), wa = tel.replace(/^0/, "49").replace(/^\+/, "");
  const subj = encodeURIComponent(`Support – ${B().name}`);
  V.innerHTML = `<h2 class="view">Support</h2>
    <div class="grid2">
      <div class="box sup" data-rv><h3>Hilfe &amp; Kontakt</h3>
        ${sup.name || sup.email || sup.phone ? `<p class="muted" style="margin-top:0">Fragen, Störung oder Änderungswunsch? Wir helfen dir schnell.</p>
        <div class="supname">${esc(sup.name || "")}</div>
        <div class="row">${sup.phone ? `<a class="btn primary" href="tel:${esc(tel)}">Anrufen · ${esc(sup.phone)}</a><a class="btn" href="https://wa.me/${esc(wa)}?text=${subj}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
        ${sup.email ? `<a class="btn" href="mailto:${esc(sup.email)}?subject=${subj}">E-Mail</a>` : ""}</div>` : `<div class="empty">Kontaktdaten folgen.</div>`}
        <p class="muted" style="font-size:13px;margin:14px 0 0">Bitte gib bei Störungen die Bestellnummer und die betroffene App an (Kasse, Küche …).</p></div>
      <div class="box" data-rv><h3>Dein Vertrag<small>${list.length ? "unterschrieben" : ""}</small></h3>
        ${k.error ? `<div class="empty">Nur Admins sehen den Vertrag.</div>` : list.length ? list.map(c => `<div class="vrow"><div><b>Vertrag Nr. ${esc(c.terms.nr)}</b><span>Unterschrieben von ${esc(c.signer_name)} am ${new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(c.signed_at))}</span>
          <span>${eur(c.terms.monthly_fee)} / Monat${+c.terms.pct_online ? ` · ${String(c.terms.pct_online).replace(".", ",")} % online` : ""}${c.terms.trial_until ? ` · Testphase bis ${new Intl.DateTimeFormat("de-DE").format(new Date(c.terms.trial_until + "T12:00"))}` : ""}</span></div>
          <button class="btn primary" type="button" data-pdf="${esc(c.id)}">PDF herunterladen</button></div>`).join("")
          : `<div class="empty">Noch kein Vertrag hinterlegt.</div>`}</div>
    </div>
    <div class="box" data-rv><h3>Schnelle Hilfe</h3><div class="faq">
      <details><summary>Preis ändern oder Gericht ausverkauft</summary><p>Dashboard → Speisekarte: Preis direkt eintippen oder den Schalter „Aktiv“ ausschalten. Gäste sehen es sofort.</p></details>
      <details><summary>Neuer Mitarbeiter</summary><p>Er öffnet Kasse oder Küche und tippt „Konto erstellen“. Danach trägst du seine E-Mail unter Team ein.</p></details>
      <details><summary>QR-Codes für die Tische drucken</summary><p>Dashboard → QR-Codes → Anzahl Tische → „Als Bild speichern“, ca. 5 × 5 cm drucken.</p></details>
      <details><summary>Lieferservice pausieren</summary><p>Dashboard → Übersicht → Schalter „Lieferservice“. Gäste sehen dann nur Abholen und Tisch.</p></details>
      <details><summary>Kein Ton in der Küche</summary><p>Einmal auf den Bildschirm tippen („Ton an“) und die Lautstärke des Geräts prüfen. Das Display nicht in den Ruhemodus schicken.</p></details>

  IH.reveal(V);

    if (error) return IH.toast("PDF nicht verfügbar", "err");

}
