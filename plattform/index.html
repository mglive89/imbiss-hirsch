<html lang="it" class="shell">
<head>
<meta charset="utf-8">
<meta name="generator" content="GallopaySystem">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GallopaySystem</title>
<meta name="theme-color" content="#141110">
<meta name="robots" content="noindex">

<style>
/* Owner view of the platform: money first (your earnings), then the clients that produce it. Gold accent = your money. */
:root{--app:#F2B33D;--gold:#F2B33D;--crest:#E5392E;--fee:#c9a274;--prov:#7fbf5f;--setup:#7fa8d9}
/* GallopaySystem brand */
.gp{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0}
.gp img{width:40px;height:40px;border-radius:10px}
.gp span{font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.04em;white-space:nowrap}
.gp span em{font-style:normal;font-weight:500;color:var(--gold)}
.gate .box > img{width:132px;height:132px;margin:0 auto;border-radius:30px}
.gate .appname{font-size:22px;letter-spacing:.06em}
.splash img{width:min(40vw,200px);border-radius:40px}
/* client editor */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.steps button{flex:1;min-width:110px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:12px;padding:9px 10px;font-family:var(--label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;cursor:pointer;text-align:left}
.steps button b{display:block;font-size:11px;color:var(--faint);letter-spacing:.14em}
.steps button[aria-current="true"]{border-color:var(--gold);color:var(--fg);background:rgba(242,179,61,.08)}
.steps button:disabled{opacity:.4;cursor:default}
.drops{display:grid;grid-template-columns:200px 1fr;gap:12px}
@media (max-width:560px){.drops{grid-template-columns:1fr}}
.drop{position:relative;border:1.5px dashed #4a443d;border-radius:14px;min-height:150px;display:grid;place-items:center;text-align:center;padding:10px;cursor:pointer;overflow:hidden;background:#141110;transition:border-color .2s}
.drop:hover,.drop.over{border-color:var(--gold)}
.drop img{max-width:100%;max-height:170px;object-fit:contain;display:block}
.drop span{color:var(--muted);font-size:14px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop small{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--faint)}
.hours{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center}
.hours label{font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.hours input[type=time]{padding:6px 8px}
.linkrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.linkrow b{font-family:var(--label);text-transform:uppercase;letter-spacing:.06em}
.linkrow code{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.linkrow{grid-template-columns:1fr auto auto}.linkrow code{grid-column:1/-1;order:3}}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qrbox .q{background:#fff;padding:10px;border-radius:10px;width:150px;height:150px}
.qrbox .q img,.qrbox .q canvas{width:130px!important;height:130px!important}
.mprev{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.mprev h4{font-family:var(--label);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px;color:var(--gold)}
.mprev div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px;border-bottom:1px dotted var(--line)}
.mprev div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.ok2{background:rgba(127,191,95,.08);border:1px solid #3e5f2f;border-radius:10px;padding:10px 12px;font-size:14px}
.cname{display:flex;align-items:center;gap:10px}
.cname .lg{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#141110;border:1px solid var(--line);flex:none}
.cname .lg.none{display:grid;place-items:center;font-family:var(--label);font-weight:700;color:var(--gold)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0}
.top .sp{flex:1}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;min-width:9.5em;text-align:center}
.hero{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:12px;margin-bottom:16px}
@media (max-width:980px){.hero{grid-template-columns:1fr 1fr}.kpi.main{grid-column:1/-1}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;min-width:0}
.kpi .k{font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--label);font-weight:700;font-size:clamp(26px,5.5vw,36px);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi .s{color:var(--faint);font-size:13px;margin-top:4px}
.kpi.main{background:linear-gradient(135deg,rgba(224,189,143,.16),rgba(224,189,143,.03)),var(--surface);border-color:#5c4a33}
.kpi.main .v{font-size:clamp(34px,8vw,52px);color:var(--gold)}
.kpi.main::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(224,189,143,.18),transparent 70%)}
.kpi .split{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.kpi .split i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;margin-bottom:16px}
.box h3{font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.box h3 small{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);font-size:13px;margin-left:auto}
.chart{display:grid;gap:8px;align-items:end;height:200px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 49px,rgba(255,255,255,.04) 49px 50px)}
.chart .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0;cursor:pointer}
.chart .c em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart .stack{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;transform-origin:bottom}
.chart .stack i{display:block;width:100%}
.chart .c.sel .stack{outline:2px solid var(--gold);outline-offset:2px}
.grow .chart .stack{animation:growY .8s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.axis{display:grid;gap:8px;margin-top:6px}
.axis span{font-size:11px;color:var(--faint);text-align:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tblwrap{overflow-x:auto}
.tbl th{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:right;padding:6px 10px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:12px 10px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:middle}
.tbl tr.row{cursor:pointer;transition:background-color .2s}
.tbl tr.row:hover{background:rgba(255,255,255,.025)}
.cname b{font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase;display:block;white-space:normal}
.cname span{color:var(--faint);font-size:13px}
.earn{color:var(--gold);font-weight:600;font-size:17px}
.earn small{display:block;color:var(--faint);font-size:12px;font-weight:400}
.trend{font-size:12px;margin-left:6px}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)}
.pill.test{color:var(--info);border-color:#35506e}
.pill.aktiv{color:var(--ok);border-color:#3e5f2f}
.pill.pausiert{color:var(--warn);border-color:#6b5524}
.pill.gekuendigt{color:var(--bad);border-color:#5a2f22}
.paid{color:var(--ok);font-size:13px}
.due{color:var(--warn);font-size:13px}
.tbl tfoot td{font-family:var(--label);font-weight:700;font-size:17px;border-top:2px solid var(--line)}
.dialog .grid{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.dialog .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dialog .actions .sp{flex:1}
.check{display:flex;align-items:center;gap:8px;font-size:15px}
.hint2{background:rgba(127,168,217,.08);border:1px solid #35506e;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.empty{margin-top:4px}
</style>
</head>
<body>

<div id="app" hidden>
  <header class="appbar">
    <a class="gp" href="./"><img src="../assets/icons/plattform-apple.png" alt=""><span>Gallopay<em>System</em></span></a>
    <span class="sp"></span>
    <span class="who" data-who></span>
    <button class="btn ghost" type="button" data-logout>Esci</button>
  </header>
  <main class="content"><div class="inner" id="view"></div></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/ih.js"></script>
<script src="../shared/staff.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const { $, esc } = IH;
const eur = v => IH.eur(v, "de-DE");   // 4.200,00 € – grouping also for 4-digit amounts
const STATUS = { test: "Prova", aktiv: "Attivo", pausiert: "In pausa", gekuendigt: "Disdetto" };
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
let sb, clients = [], stats = [], pays = [];
let ym = IH.berlinToday().slice(0, 7);
const nowYM = IH.berlinToday().slice(0, 7);
const prevKpi = {};

IH.splash("../assets/icons/plattform-512.png", "");
IH.staffGate({ app: "GallopaySystem", logo: "../assets/icons/plattform-apple.png", role: "platform", onReady: async (ctx) => { sb = ctx.sb; await load(true); live(); } });

/* ---------- data ---------- */
async function load(animate){
  const [c, s, p] = await Promise.all([
    sb.from("clients").select("*").order("created_at"),
    sb.rpc("platform_overview", { p_months: 13 }),
    sb.from("client_payments").select("*").order("month", { ascending: false }).limit(1000),
  ]);
  if (c.error || s.error || p.error){ $("view").innerHTML = `<div class="empty">Dati non disponibili: ${esc((c.error || s.error || p.error).message)}</div>`; return; }
  clients = c.data; stats = s.data || []; pays = p.data;
  render(animate);
}
let liveT;
function live(){
  sb.channel("plattform").on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => { clearTimeout(liveT); liveT = setTimeout(() => load(false), 2000); }).subscribe();
  setInterval(() => load(false), 120000);
}

/* ---------- money ---------- */
const months = (n, end = nowYM) => { const [y, m] = end.split("-").map(Number); return Array.from({ length: n }, (_, k) => { const d = new Date(Date.UTC(y, m - 1 - (n - 1 - k), 1)); return d.toISOString().slice(0, 7); }); };
const shiftYM = (v, d) => { const [y, m] = v.split("-").map(Number); return new Date(Date.UTC(y, m - 1 + d, 1)).toISOString().slice(0, 7); };
const ymLabel = v => { const [y, m] = v.split("-").map(Number); return `${MESI[m - 1]} ${y}`; };
const agg = (cid, m) => stats.find(x => x.client_id === cid && x.month === m) || { orders: 0, revenue: 0, online: 0, cash: 0, card: 0, open: 0, deliveries: 0, tables: 0, cancelled: 0 };
// what you earn from one client in one month
function earn(c, m){
  const a = agg(c.id, m), start = c.started_at.slice(0, 7), trial = c.trial_until ? c.trial_until.slice(0, 7) : null;
  if (m < start) return { fee: 0, prov: 0, setup: 0, total: 0, a };
  const billable = c.status === "aktiv" && (!trial || m > trial);
  const fee = billable ? +c.monthly_fee : 0;
  const prov = billable ? (+c.pct_online / 100) * +a.online + (+c.fee_per_order) * +a.orders : 0;
  const setup = m === start ? +c.setup_fee : 0;
  return { fee, prov, setup, total: fee + prov + setup, a };
}
const paidFor = (cid, m) => pays.filter(p => p.client_id === cid && p.month.slice(0, 7) === m).reduce((s, p) => s + +p.amount, 0);
// still to collect for a month: fee + commission (+ setup in the start month, unless marked paid) minus what you recorded
function due(c, m){ const e = earn(c, m); return Math.max(0, e.fee + e.prov + (e.setup && !c.setup_paid ? e.setup : 0) - paidFor(c.id, m)); }

/* ---------- render ---------- */
function render(animate){
  const sel = months(12, nowYM);
  const perMonth = sel.map(m => clients.reduce((t, c) => { const e = earn(c, m); t.fee += e.fee; t.prov += e.prov; t.setup += e.setup; t.total += e.total; return t; }, { m, fee: 0, prov: 0, setup: 0, total: 0 }));
  const cur = clients.reduce((t, c) => { const e = earn(c, ym); t.fee += e.fee; t.prov += e.prov; t.setup += e.setup; t.total += e.total; t.rev += +e.a.revenue; t.orders += +e.a.orders; return t; }, { fee: 0, prov: 0, setup: 0, total: 0, rev: 0, orders: 0 });
  const mrr = clients.filter(c => c.status === "aktiv").reduce((s, c) => s + +c.monthly_fee, 0);
  const year = ym.slice(0, 4);
  const ytd = months(13, ym).filter(m => m.startsWith(year)).reduce((s, m) => s + clients.reduce((t, c) => t + earn(c, m).total, 0), 0);
  const open = clients.reduce((s, c) => s + months(13, nowYM).filter(m => m <= nowYM).reduce((t, m) => t + due(c, m), 0), 0);
  const active = clients.filter(c => c.status === "aktiv").length, trial = clients.filter(c => c.status === "test").length;
  const maxM = Math.max(1, ...perMonth.map(x => x.total));
  const prevYM = shiftYM(ym, -1);
  const rows = clients.map(c => {
    const e = earn(c, ym), a = e.a, pa = agg(c.id, prevYM);
    const tr = +pa.revenue ? Math.round((a.revenue - pa.revenue) / pa.revenue * 100) : null;
    const d = due(c, ym), paid = paidFor(c.id, ym);
    const payCell = (e.fee + e.prov) === 0 ? `<span class="muted">—</span>` : d <= 0.005 ? `<span class="paid">✓ Pagato</span>` : `<span class="due">${eur(d)} da incassare</span> <button class="btn" type="button" data-pay="${esc(c.id)}" style="padding:4px 10px;font-size:13px;margin-left:6px">Segna pagato</button>`;
    return `<tr class="row" data-open="${esc(c.id)}">
      <td><div class="cname">${c.logo_url ? `<img class="lg" src="${esc(c.logo_url)}" alt="">` : `<span class="lg none">${esc((c.name || "?")[0])}</span>`}<div><b>${esc(c.name)}</b><span>${esc(c.city || "")} · <span class="pill ${c.status}">${STATUS[c.status]}</span></span></div></div></td>
      <td>${a.orders}</td>
      <td>${eur(a.revenue)}${tr === null ? "" : `<span class="trend ${tr >= 0 ? "up" : "down"}">${tr >= 0 ? "▲" : "▼"}${Math.abs(tr)}%</span>`}</td>
      <td>${eur(a.online)}</td>
      <td class="earn">${eur(e.total)}<small>${[e.fee ? "canone " + eur(e.fee) : "", e.prov ? "provv. " + eur(e.prov) : "", e.setup ? "setup " + eur(e.setup) : ""].filter(Boolean).join(" · ") || (c.status === "test" ? "in prova" : "")}</small></td>
      <td>${payCell}</td></tr>`;
  }).join("");
  $("view").innerHTML = `
  <div class="top"><h2 class="view" style="margin:0">La mia piattaforma</h2><span class="sp"></span>
    <div class="monthnav"><button class="iconbtn" id="mPrev" type="button" aria-label="Mese precedente"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b>${ymLabel(ym)}</b><button class="iconbtn" id="mNext" type="button" aria-label="Mese successivo" ${ym >= nowYM ? "disabled" : ""}><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <button class="btn" id="csv" type="button">Esporta CSV</button>
    <button class="btn primary" id="newC" type="button">+ Nuovo cliente</button></div>
  <div class="hero">
    <div class="kpi main"><div class="k">Il tuo guadagno · ${ymLabel(ym)}</div><div class="v" id="k-earn">${eur(cur.total)}</div>
      <div class="split"><span><i style="background:var(--fee)"></i>Canoni ${eur(cur.fee)}</span><span><i style="background:var(--prov)"></i>Provvigioni ${eur(cur.prov)}</span><span><i style="background:var(--setup)"></i>Setup ${eur(cur.setup)}</span></div></div>
    <div class="kpi"><div class="k">Entrate fisse / mese</div><div class="v" id="k-mrr">${eur(mrr)}</div><div class="s">${active} attivi · ${trial} in prova</div></div>
    <div class="kpi"><div class="k">Guadagno ${year}</div><div class="v" id="k-ytd">${eur(ytd)}</div><div class="s">fino a ${ymLabel(ym)}</div></div>
    <div class="kpi"><div class="k">Da incassare</div><div class="v" id="k-open" style="color:${open > 0.005 ? "var(--warn)" : "var(--ok)"}">${eur(open)}</div><div class="s">canoni e provvigioni non segnati</div></div>
  </div>
  <div class="box${animate ? " grow" : ""}"><h3>Guadagno ultimi 12 mesi<small>clic su un mese per i dettagli</small></h3>
    <div class="chart" style="grid-template-columns:repeat(12,1fr)">${perMonth.map((x, k) => `<div class="c${x.m === ym ? " sel" : ""}" data-m="${x.m}" style="--i:${k}"><em>${x.total ? Math.round(x.total) + " €" : ""}</em><div class="stack" style="height:${x.total / maxM * 84}%">${[["fee","var(--fee)"],["prov","var(--prov)"],["setup","var(--setup)"]].map(([k2, col]) => x[k2] ? `<i style="height:${x[k2] / x.total * 100}%;background:${col}"></i>` : "").join("")}</div></div>`).join("")}</div>
    <div class="axis" style="grid-template-columns:repeat(12,1fr)">${perMonth.map(x => `<span>${MESI[+x.m.slice(5) - 1]}</span>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--fee)"></i>Canoni</span><span><i style="background:var(--prov)"></i>Provvigioni</span><span><i style="background:var(--setup)"></i>Setup</span></div></div>
  <div class="box"><h3>Clienti · ${ymLabel(ym)}<small>fatturato passato dalla tua piattaforma</small></h3>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Ordini</th><th>Fatturato</th><th>di cui online</th><th>Tuo guadagno</th><th>Pagamento</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="6"><div class="empty">Nessun cliente.</div></td></tr>`}</tbody>
    <tfoot><tr><td>Totale</td><td>${cur.orders}</td><td>${eur(cur.rev)}</td><td>${eur(clients.reduce((s, c) => s + +agg(c.id, ym).online, 0))}</td><td class="earn">${eur(cur.total)}</td><td></td></tr></tfoot></table></div></div>`;
  IH.countUp($("k-earn"), cur.total, eur, animate ? 0 : prevKpi.earn);
  IH.countUp($("k-mrr"), mrr, eur, animate ? 0 : prevKpi.mrr);
  IH.countUp($("k-ytd"), ytd, eur, animate ? 0 : prevKpi.ytd);
  IH.countUp($("k-open"), open, eur, animate ? 0 : prevKpi.open);
  Object.assign(prevKpi, { earn: cur.total, mrr, ytd, open });
  $("mPrev").onclick = () => { ym = shiftYM(ym, -1); if (ym < months(13)[0]) ym = months(13)[0]; render(false); };
  $("mNext").onclick = () => { ym = shiftYM(ym, 1); if (ym > nowYM) ym = nowYM; render(false); };
  $("view").querySelectorAll(".chart .c").forEach(el => el.onclick = () => { ym = el.dataset.m; render(false); });

async function markPaid(c, m){

/* ---------- images: logo, cover, square app icon ---------- */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function canvasBlob(cv, type, q){ return new Promise(r => cv.toBlob(r, type, q)); }
async function scaled(img, maxW, maxH, type, q){
  const k = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight), cv = document.createElement("canvas");
  cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return { blob: await canvasBlob(cv, type, q), cv };
}
// square icon for the home screen: logo centred on its own background colour (top-left pixel), dark if transparent
async function squareIcon(img){
  const S = 512, cv = document.createElement("canvas"); cv.width = cv.height = S;
  const g = cv.getContext("2d"), probe = document.createElement("canvas"); probe.width = probe.height = 1;
  const pg = probe.getContext("2d"); pg.drawImage(img, 0, 0, 1, 1, 0, 0, 1, 1);
  const [r, gg, b, a] = pg.getImageData(0, 0, 1, 1).data;
  g.fillStyle = a > 200 ? `rgb(${r},${gg},${b})` : "#141110"; g.fillRect(0, 0, S, S);
  const k = Math.min(S * .8 / img.naturalWidth, S * .8 / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
  g.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
  return canvasBlob(cv, "image/png");
}
async function pickFile(kind, file){
  if (!/^image\//.test(file.type)) return IH.toast("Serve un'immagine (JPG, PNG o WebP)", "err");
  captureEditor();
  const url = URL.createObjectURL(file), img = await loadImg(url);
  if (kind === "logo"){
    const isPng = file.type === "image/png" || file.type === "image/webp";
    ed.files.logo = (await scaled(img, 1200, 800, isPng ? "image/png" : "image/jpeg", .9)).blob;
    ed.files.icon = await squareIcon(img);
  } else ed.files.cover = (await scaled(img, 1400, 1000, "image/jpeg", .86)).blob;
  ed.prev[kind] = url;
  paintEditor();
}
async function upload(cid, name, blob){
  const ext = blob.type === "image/png" ? "png" : "jpg", path = `${cid}/${name}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("brand").upload(path, blob, { contentType: blob.type, upsert: true, cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from("brand").getPublicUrl(path).data.publicUrl;
}

async function saveClient(){
  captureEditor();
  const c = ed.c, fail = m => { const e = $("cErr"); if (e){ e.textContent = m; e.hidden = false; } else IH.toast(m, "err"); };
  if (!c.name) { ed.tab = "locale"; paintEditor(); return fail("Inserisci il nome dell'attività."); }
  if (!c.id || c.id.length < 3) { ed.tab = "locale"; paintEditor(); return fail("Codice link troppo corto (min. 3 lettere)."); }
  if (ed.isNew && clients.some(x => x.id === c.id)) { ed.tab = "locale"; paintEditor(); return fail("Questo codice link esiste già. Scegline un altro."); }
  const btn = $("cSave"); if (btn){ btn.disabled = true; btn.textContent = "Salvataggio …"; }
  try {
    if (ed.files.logo) c.logo_url = await upload(c.id, "logo", ed.files.logo);
    if (ed.files.icon) c.icon_url = await upload(c.id, "icon", ed.files.icon);
    if (ed.files.cover) c.cover_url = await upload(c.id, "cover", ed.files.cover);
  } catch (e) { if (btn){ btn.disabled = false; btn.textContent = "Riprova"; } return fail("Caricamento immagine non riuscito: " + e.message); }
  ed.files = {};
  const row = { name: c.name, city: c.city, contact: c.contact, status: c.status, monthly_fee: c.monthly_fee, pct_online: c.pct_online, fee_per_order: c.fee_per_order,
    setup_fee: c.setup_fee, started_at: c.started_at, trial_until: c.trial_until, setup_paid: c.setup_paid, notes: c.notes,
    logo_url: c.logo_url || null, cover_url: c.cover_url || null, icon_url: c.icon_url || null, address: c.address, phone: c.phone,
    tagline: c.tagline, subline: c.subline, hours: c.hours, google_review_url: c.google_review_url };
  const { error } = ed.isNew ? await sb.from("clients").insert({ ...row, id: c.id }) : await sb.from("clients").update(row).eq("id", c.id);
  if (error){ if (btn){ btn.disabled = false; btn.textContent = "Riprova"; } return fail(error.message); }
  IH.store.del("ih-brand:" + c.id);
  const wasNew = ed.isNew;
  await load(false);
  ed.isNew = false;
  ed.c = { ...(clients.find(x => x.id === c.id) || c) };
  $("eTitle").textContent = ed.c.name;
  if (wasNew){ IH.burst(innerWidth / 2, 120); IH.toast(`${c.name} creato · ora il menù`); ed.tab = "menu"; }
  else IH.toast("Salvato");
  paintEditor();
}

async function readFlyer(files){
  files = files.filter(f => /^image\//.test(f.type)).slice(0, 4);
  if (!files.length) return IH.toast("Serve una foto (JPG/PNG). Un PDF: fai uno screenshot della pagina.", "err");
  const out = $("flyOut");
  out.innerHTML = `<div class="ok2">Leggo il volantino e traduco in 5 lingue … (circa 30–60 secondi)</div>`;
  try {
    const images = [];
    for (const f of files){
      const u = URL.createObjectURL(f), img = await loadImg(u);
      const { cv } = await scaled(img, 1800, 1800, "image/jpeg", .85);
      images.push({ media_type: "image/jpeg", data: cv.toDataURL("image/jpeg", .85).split(",")[1] });
    }
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(FN("menu-from-flyer"), { method: "POST", headers: { "Content-Type": "application/json", apikey: IH_CONFIG.key, Authorization: "Bearer " + session.access_token }, body: JSON.stringify({ images }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ("Errore " + r.status));
    ed.flyer = d.menu; ed.flyerCut = d.truncated;
    paintFlyer();
  } catch (e) {
    out.innerHTML = `<div class="hint2"><b>Import automatico non riuscito.</b> ${esc(e.message)}<br>Se manca la chiave: Supabase → Edge Functions → Secrets → <code>ANTHROPIC_API_KEY</code>. Oppure mandami il volantino in chat e lo inserisco io.</div>`;
  }
}
function paintFlyer(){
  const m = ed.flyer, cats = (m && m.categories) || [], n = cats.reduce((s, k) => s + k.items.length, 0);
  const price = it => [it.price_pickup, it.price_delivery].filter(v => v != null).map(v => eur(v)).join(" / ") || "—";
  const extra = [m.tagline && "slogan", m.hours && Object.keys(m.hours).length && "orari", m.phone && "telefono", m.address && "indirizzo"].filter(Boolean);
  $("flyOut").innerHTML = `<div class="grid">
    <div class="ok2">Trovati <b>${n}</b> piatti in <b>${cats.length}</b> categorie, con traduzioni EN · IT · TR · FR.${ed.flyerCut ? " Il volantino è molto lungo: controlla che ci sia tutto." : ""} Controlla i prezzi prima di importare.</div>
    <div class="mprev">${cats.map(k => `<h4>${esc(k.names.de)}${k.is_drink ? " · bevande" : ""}</h4>${k.items.map(it => `<div><span>${esc(it.names.de)}${it.tag === "veg" ? " 🌱" : ""}</span><span>${price(it)}</span></div>`).join("")}`).join("")}</div>
    ${ed.menuCount && ed.menuCount.items ? `<label class="check"><input type="checkbox" id="fReplace" checked> Sostituisci il menù attuale (${ed.menuCount.items} piatti)</label>` : ""}
    ${extra.length ? `<label class="check"><input type="checkbox" id="fExtra" checked> Usa anche ${extra.join(", ")} dal volantino (solo dove vuoto)</label>` : ""}
    <div class="actions" style="margin:0"><button class="btn" type="button" id="fDrop">Scarta</button><span class="sp"></span><button class="btn primary" type="button" id="fImp">Importa ${n} piatti</button></div></div>`;
  $("fDrop").onclick = () => { ed.flyer = null; $("flyOut").innerHTML = ""; };

}
async function importFlyer(){
  const c = ed.c, m = ed.flyer, btn = $("fImp"); btn.disabled = true; btn.textContent = "Importo …";
  const fail = msg => { btn.disabled = false; btn.textContent = "Riprova"; IH.toast(msg, "err"); };
  if ($("fReplace") && $("fReplace").checked){
    const a = await sb.from("menu_items").delete().eq("client_id", c.id);
    if (a.error) return fail(a.error.message);
    const b = await sb.from("categories").delete().eq("client_id", c.id);
    if (b.error) return fail(b.error.message);
  }
  const { data: have } = await sb.from("categories").select("id,sort").eq("client_id", c.id);
  const used = new Set((have || []).map(x => x.id));
  let sort = Math.max(-1, ...(have || []).map(x => x.sort || 0)) + 1;
  const catRows = [], itemRows = [];
  for (const k of m.categories){
    let id = `${c.id}-${IH.slug(k.names.de) || "kat"}`, n = 2;
    while (used.has(id)) id = `${c.id}-${IH.slug(k.names.de) || "kat"}-${n++}`;
    used.add(id);
    catRows.push({ id, client_id: c.id, sort: sort++, names: k.names, is_drink: !!k.is_drink });
    k.items.forEach((it, j) => itemRows.push({ client_id: c.id, category_id: id, sort: j, names: it.names, descs: it.descs || null,
      price_pickup: it.price_pickup ?? null, price_delivery: it.price_delivery ?? null, tag: ["veg", "house"].includes(it.tag) ? it.tag : null, available: true }));
  }
  let r = await sb.from("categories").insert(catRows);
  if (r.error) return fail(r.error.message);
  r = await sb.from("menu_items").insert(itemRows);
  if (r.error) return fail(r.error.message);
  if ($("fExtra") && $("fExtra").checked){
    const p = {};
    if (m.tagline && !IH.pickL(c.tagline)) p.tagline = m.tagline;
    if (m.hours && Object.keys(m.hours).length && !Object.keys(c.hours || {}).length) p.hours = m.hours;
    if (m.phone && !c.phone) p.phone = m.phone;
    if (m.address && !c.address) p.address = m.address;
    if (Object.keys(p).length){ await sb.from("clients").update(p).eq("id", c.id); Object.assign(c, p); IH.store.del("ih-brand:" + c.id); }
  }
  IH.sound.paid(); IH.burst(innerWidth / 2, 160);
  IH.toast(`${itemRows.length} piatti importati`);
  ed.flyer = null; await load(false);
  paintMenuTab();
}

/* ---------- step 4: links, QR, owner login ---------- */
async function paintAppTab(){
  const c = ed.c, B = $("eBody"), guest = appUrl("kunde", c.id);
  B.innerHTML = `<div class="grid">
    <div class="qrbox"><div class="q" id="qGuest"></div><div style="flex:1;min-width:200px"><b class="lbl">QR per gli ospiti</b><p class="muted" style="margin:6px 0 10px">Menù di ${esc(c.name)} con il suo logo. I QR per ogni tavolo li stampa il titolare dalla sua Dashboard → QR-Codes.</p>
      <a class="btn primary" href="${esc(guest)}" target="_blank" rel="noopener">Prova come ospite ↗</a></div></div>
    <div>${APPS.map(([k, n, d]) => { const u = appUrl(k, c.id); return `<div class="linkrow"><b>${n}</b><code title="${esc(d)}">${esc(u)}</code><a class="btn" href="${esc(u)}" target="_blank" rel="noopener">Apri</a><button class="btn" type="button" data-copy="${esc(u)}">Copia</button></div>`; }).join("")}</div>
    <div class="field"><span class="lbl">Accesso del titolare</span>
      <p class="muted" style="margin:0 0 6px;font-size:14px">1) Il titolare apre la Dashboard, tocca „Konto erstellen“ e conferma l'e-mail. 2) Tu inserisci qui la sua e-mail. Poi abilita lui stesso i dipendenti (Dashboard → Team).</p>
      <div class="g2" style="align-items:end"><input id="oMail" type="email" placeholder="titolare@esempio.de"><button class="btn primary" type="button" id="oAdd">Abilita come titolare</button></div></div>
    <div id="oList" class="muted" style="font-size:14px"></div>
    <div class="actions"><span class="sp"></span><button class="btn primary" type="button" id="eDone">Fatto</button></div></div>`;
  try { new QRCode($("qGuest"), { text: guest, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  B.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); IH.toast("Link copiato"); } catch (e) { IH.toast(b.dataset.copy); } });
  $("eDone").onclick = closeDialog;
  $("oAdd").onclick = async () => {
    const mail = $("oMail").value.trim(); if (!mail) return;
    const { error } = await sb.rpc("add_staff", { p_email: mail, p_admin: true, p_client: c.id });
    if (error) return IH.toast(error.message, "err");
    IH.sound.paid(); IH.toast(`${mail} è titolare di ${c.name}`); $("oMail").value = ""; loadOwners();
  };
  loadOwners();
}
async function loadOwners(){
  const { data } = await sb.from("staff").select("email,is_admin").eq("client_id", ed.c.id).order("created_at");
  if ($("oList")) $("oList").innerHTML = data && data.length ? "Accessi: " + data.map(s => `${esc(s.email)}${s.is_admin ? " (admin)" : ""}`).join(" · ") : "Nessun accesso ancora.";
}

function exportCsv(){
  const head = ["Cliente","Stato","Mese","Ordini","Fatturato","Online","Contanti","Carta","Consegne","Canone","Provvigioni","Setup","Guadagno totale","Incassato"];
  const lines = [head.join(";")].concat(clients.map(c => { const e = earn(c, ym), a = e.a; return [c.name, STATUS[c.status], ym, a.orders, a.revenue, a.online, a.cash, a.card, a.deliveries, e.fee, e.prov, e.setup, e.total, paidFor(c.id, ym)].map(v => typeof v === "number" ? String(Math.round(v * 100) / 100).replace(".", ",") : `"${String(v).replace(/"/g, '""')}"`).join(";"); }));
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `piattaforma-${ym}.csv`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  IH.toast("CSV esportato");
}
